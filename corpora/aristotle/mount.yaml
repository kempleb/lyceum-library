# Lyceum P3 stage 2 (docs/p3-plan.md, Settled decisions 1-2, Stage sequence 2).
# Mount configuration for the aristotle corpus: where its built data lives on
# this machine, and what mount-corpus.mjs excludes when it flat-merges the
# corpus's work directories into build/dist alongside the classical works.
#
# Stage 4's [author]/[work]/[cite].astro shim route reads citationRoutes and
# emits one static accept URL for each indexed column owned by this corpus.

corpus: aristotle

# Resolved as: process.env[source_env] ?? source_default, relative to this
# repo's root. The sibling repo is read-only; nothing here is ever written
# back to it (see mount-corpus.mjs's realpath(dest)-inside-this-repo assert).
source_env: ARISTOTLE_DATA_DIR
source_default: ../aristotle-reader/build/dist

# Top-level entries under the source directory that are never copied into
# build/dist. lemmata/lemmata.json/lemma-map/lemma-picker/ngrams/reports are
# regenerated by THIS repo's own build (the concordance spans both corpora
# for free once every work is registered); bekker.json is retired in favor
# of the generated citation-index.json (Settled decision 5, handoff item 7).
# lsj/ is deliberately absent from this list -- it is merged key-by-key via
# corpus-adapter/lsj-merge.mjs, not copied or excluded wholesale.
exclude:
  - lemmata
  - lemmata.json
  - lemma-map
  - lemma-picker
  - ngrams
  - reports
  - bekker.json

# Per-work search/ subdirectory entries that are never copied. offsets.json,
# grammar-dict.json, and grammar-col.bin have no consumer in this repo's
# reader (probe-established fact, docs/p3-plan.md).
search_exclude:
  - offsets.json
  - grammar-dict.json
  - grammar-col.bin

citationRoutes: true
