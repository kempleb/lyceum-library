# Protagoras of Abdera Fragments (DK 80 B) — pipeline manifest (dk scheme:
# one flat div[@type="Fragment"][@n] per citable fragment, plain <p> prose,
# no <l> lines).
#
# Freeman Ancilla wave phase 1 pilot (docs/freeman-wave-design.md):
# Kathleen Freeman's Ancilla to the Pre-Socratic Philosophers (1948) wired
# as sole english.primary (Freeman-only — Burnet never covers the
# Sophists, so there is no secondary to flip). Extraction, kind
# classification, ordering verification, and mechanical-fix log: see
# sources/freeman-ancilla/README.md's Protagoras section.
#
# Confirmed directly against the export's own <sourceDesc>: 'Protagoras
# Soph., Fragmenta (1635: 002) "Die Fragmente der Vorsokratiker, vol. 2, 6th
# edn.", ...'.
#
# TITLE DIV (1, stripped by `_DK_TITLE_N_RE`, never a column): "tit,6-6b"
# (the treatise title covering B6/B6a/B6b, translated in DK's own apparatus
# as "The Art of Disputation"). Content-verified pure section-title header
# (a `<label type="head">` line only, no fragment text of its own) — the
# plain title-div shape, not the Democritus B0a shape (an ordinary numbered
# column that happens to be a real one-line title-fragment with its own DK
# letter-number).
#
# TITLE-ONLY COLUMNS (a REAL DK numbering quirk, content-verified, NOT
# stripped): B8a through B8h (8 columns) are Diogenes Laertius' own list of
# Protagoras' further book titles (DK 80 B8's own further-titles heading),
# each carrying its own DK letter and NOTHING but a bare Greek title (e.g.
# B8a = "On the Constitution") -- no citation apparatus, no quoted content,
# no letter-spacing. These are genuine, individually-cited DK columns (cf.
# Gorgias B9 below in gorgias-fragments.yaml, the bare title of the lost
# Pythian Oration, the same shape) — declared `unmarked_columns`, not
# `div_map`/title-stripped.
# B7 (a title whose export spelling is a one-letter Beta-code-decoding
# artifact off the standard Attic form, passed through unmodified per the
# corpus-text-verbatim rule) is likewise a genuine unmarked column:
# Aristotle's whole testimonium about Protagoras' lost work on mathematics,
# entirely in <hi rend="small">, no letter-spacing anywhere.
#
# VERSE CHECK: exported plain (no `-y`); confirmed 0 <l> elements anywhere in
# the export.
#
# STRUCTURE: 21 raw divs = 1 title div (stripped) + 20 citable columns:
# B1-B5 (5), B6/B6a/B6b (3), B7 (1), B8/B8a-B8h (9), B9-B10 (2). No gaps,
# no div_map/div_concat/compound_n_map cases.
#
# LETTER-SPACING FINDING: 11 of 20 columns carry at least one
# <hi rend="letter-spacing"> span; 9 are fully unmarked (B7, B8a-B8h) —
# declared below.
#
# LATIN: B6 (Cicero/Quintilian on the Protagoras-Euathlus lawsuit) carries
# exactly one marked role='text' span, the Latin proper name of Protagoras'
# opponent in the lawsuit — zero Greek tokens for this fragment, a genuine
# `latin_fragments` case (Wave 1b memo §4.4 — same posture as Heraclitus
# B4): kept, displayed, not clickable.

work:
  id: protagoras-fragments
  title: "Fragments"
  author: "protagoras"
  language: "grc"
  tlg_author: "1635"
  tlg_work: "002"
  greek_edition: "Diels, H. and Kranz, W. (eds.), Die Fragmente der Vorsokratiker, 6th ed., vol. 2 (Berlin: Weidmann, 1952), 80 B"
  # FATAL sourceDesc gate: stage1's _check_sourcedesc asserts this exact
  # substring is present in the export XML's own <teiHeader><sourceDesc>
  # text -- verified verbatim against build/export/.../tlg1635002.xml.
  expected_sourcedesc: 'Protagoras Soph., Fragmenta (1635: 002) "Die Fragmente der Vorsokratiker, vol. 2'

citation:
  expand_citations: true  # DK source-citation expansion, rule E (John, 2026-09-24)
  scheme: dk
  series: B
  # dk_witness.py's owner-verified apparatus split (stage7_emit wiring):
  # count of this work's columns whose apparatus actually splits into
  # 2+ witnesses, cross-checked bidirectionally at preflight against the
  # emitted dist's own `witnesses` keys -- catches an unreviewed new
  # split and a stale declaration alike.
  dk_witness_split_columns: 2
  # Quote-mark polarity fix (owner ruling 2026-08-05, "we fix it and
  # make damn sure every instance is correct"): the raw TLG export
  # frequently opens a Greek quotation with U+2019 instead of U+2018 --
  # stage1_greek._dk_normalize_quote_marks fixes every BALANCED
  # (even-count) column automatically; this is that fix's own declared
  # count, cross-checked bidirectionally at preflight against the
  # emitted dist's actual U+2018/U+2019 total.
  dk_quote_marks_rewritten: 14
  hideLineNumbers: true
  unmarked_columns:
    - B7
    - B8a
    - B8b
    - B8c
    - B8d
    - B8e
    - B8f
    - B8g
    - B8h
  latin_fragments:
    - B6
  # Freeman Ancilla wave phase 1 (design note §1(b)/§6): declared per-
  # column entry-type classification, gated in two directions --
  # stage1_freeman_english.py asserts this equals the checked-in clean
  # JSON's own `kind` (staleness, AFTER kind_overrides resolution --
  # see below); preflight's dist-level _validate_freeman_kinds
  # independently re-derives consistency against the LIVE Greek role
  # profile on every rebuild (title/note: no role='text'; verbatim: >=1
  # role='text'; embedded: >=1 role='context').
  #
  # RESOLVED (John's ruling, 2026-07-23): B5, B6, B6a were wholly-italic
  # parenthetical entries in Freeman's English with NO small-caps named
  # source -- the extractor classifies these `conflict`, not `note` or
  # `embedded` outright, because the literal-markup default (`note`)
  # DISAGREES with the live Greek spine, which carries a role='text' span
  # for all three (the title-word itself for B5, the Latin proper name
  # "Euathlus" for B6, the reported phrase for B6a) -- see
  # sources/freeman-ancilla/README.md's Protagoras section for the full
  # philological note. Per design note §1(b)'s "no heuristic tie-break"
  # rule, this disagreement can ONLY be resolved by an explicit,
  # human-authored `citation.kind_overrides` declaration (each entry
  # requires a `note` justifying the ruling) -- see
  # stage1_freeman_english.py's `_resolve_kind_overrides`. John's ruling
  # did NOT uniformly pick `embedded`: B5's survival is the book-title
  # itself (extends `title` to a "title-survivals-in-frame" case --
  # preflight._FREEMAN_KIND_ROLE_RULE loosened accordingly); B6's sole
  # text-role span is a bare proper name, not the philosopher's own words
  # (`note`, Freeman's own narrating voice); B6a's dictum survives near-
  # verbatim in Diogenes Laertius' report (`embedded`, unchanged from the
  # pre-review guess).
  #
  # B7 (round-2 fix, residual 1): the extractor's ambiguity rule was
  # tightened so a wholly-italic-parenthetical entry is ALWAYS `conflict`,
  # even when the Greek spine carries no role='text' (i.e. even when the
  # hint AGREES with the conservative `note` reading -- agreement is
  # evidence, not a resolution). B7's Greek role profile has no role='text'
  # span at all (confirmed by a full print audit of the Grok-verified
  # export, not just the automated hint) -- the override originally
  # recorded this as `note` (a human looked, per the same "no heuristic
  # tie-break" rule applied to B5/B6/B6a above), but was retroactively
  # flipped to `omit` under John's 2026-07-23 ruling ("don't ship things
  # for which we have no greek"): a testimonium-only column with no
  # Democritean/Protagorean Greek for Freeman's report to face ships no
  # Freeman English at all (see the B7 kind_overrides entry below).
  kind_overrides:
    B5:
      kind: title
      note: >
        John's ruling 7/23: the survival is the book-title Ἀντιλογικοῖς —
        title kind extended to title-survivals-in-frame
    B6:
      kind: note
      note: >
        John's ruling 7/23: sole text-role span is the name Euathlus — a
        name is not his words; Freeman's summary treated as editorial note
    B6a:
      kind: embedded
      note: >
        John's ruling 7/23: the δύο λόγους dictum survives near-verbatim
        in DL's report
    B7:
      kind: omit
      reason: >
        testimonium-only column -- markup-unambiguous per Grok print audit,
        no role='text' span anywhere in B7's Greek, so Freeman's editorial
        report has no Democritean/Protagorean Greek to translate. Retro-
        actively flipped from `note` to `omit` under John's 2026-07-23
        ruling ("don't ship things for which we have no greek"); the
        wholly-italic-parenthetical shape is still flagged `conflict` by
        the extractor's tightened rule (round-2 fix), a human confirmed
        the literal-markup reading
  fragment_kinds:
    B1: verbatim
    B2: embedded
    B3: verbatim
    B4: verbatim
    B5: title
    B6: note
    B6a: embedded
    B6b: verbatim
    B7: omit
    B8: embedded
    B8a: title
    B8b: title
    B8c: title
    B8d: title
    B8e: title
    B8f: title
    B8g: title
    B8h: title
    B9: verbatim
    B10: verbatim

# No `display_order` declared: Freeman's own printed sequence (1, 2, 3, 4,
# 5, 6, 6a, 6b, 7, 8, 8a-8h, 9, 10) is IDENTICAL to the Greek spine's own
# document order (design note §3.7) — verified directly against
# build/dist/protagoras-fragments/book-01.json's segment order, logged in
# sources/freeman-ancilla/README.md. Display therefore defaults to spine
# order unmodified.
#
# No `freeman_concordance` declared: every Freeman entry 1-10 (plus
# 6a/6b/8a-8h) matches an existing DK80B spine column by exact token, no
# Diels-5/Kranz-6 drift for this chapter (design note §2). Freeman's own
# entries 11 and 12 (beyond the spine's last column, B10) are English
# orphans with no corresponding DK column — dropped before the clean JSON
# was committed, per the Melissus 1a/6a precedent; see the README.
#
# No `abridged_columns` declared: Gorgias-only (design note §2's Gorgias
# abridgment finding does not apply to Protagoras).
#
# Group headers (design note §1/§3.7): Freeman's own subject/category
# labels, all level 2 (wholly italic, no small-caps content anywhere in
# this chapter -- level 1 is exercised at the Democritus/phase-2 stress
# case). sha256_16 = hashlib.sha256(text.encode()).hexdigest()[:16], the
# dk_lang/title-drop hash convention; gated against
# sources/freeman-ancilla/freeman-protagoras.group_headers.json by
# stage1_freeman_english.py (stale text/hash/count/order = fatal).
group_headers:
  - before_column: B6
    level: 2
    text: "Doubtful titles (taken from Diogenes Laertius)"
    sha256_16: "95e8b66291e79c0b"
  - before_column: B7
    level: 2
    text: "'On Mathematics'"
    sha256_16: "95b357d7dd8fee5d"
  - before_column: B8
    level: 2
    text: "'On Wrestling and the Other Arts'"
    sha256_16: "c91c0f4e95154000"
  - before_column: B8a
    level: 2
    text: "(Titles)"
    sha256_16: "fda321cb633d70b6"
  - before_column: B9
    level: 2
    text: "From unspecified writings"
    sha256_16: "b26dd3deda0f43c9"

english:
  primary:
    id: freeman
    name: "Kathleen Freeman, Ancilla to the Pre-Socratic Philosophers (Blackwell, 1948)"
    model: freeman
    file: "freeman-ancilla/freeman-protagoras.clean.json"
    license:
      status: public-domain-us
      rationale: "Kathleen Freeman's Ancilla to the Pre-Socratic Philosophers (1948) is treated as US public domain per John's 2026-07-23 ruling (CANON.md, Freeman Ancilla copyright ruling); covered by attribution.astro's site-wide translation public-domain notice."
    group_headers_file: "freeman-ancilla/freeman-protagoras.group_headers.json"
  # John's ruling 2026-07-29: B6a is Freeman's own wholly parenthetical
  # précis, ALSO covered by a translated context-english source-passage span
  # for the same column -- suppressed outright rather than labeled
  # (stage1_freeman_english.py gate 5; the Greek renders alone beside the
  # source passage). B5/B6/B8 are précis with no such coverage -- labeled a
  # summary instead (see EnglishChunk.summary).
  summary_suppressed: [B6a]
  summary_labels: [B5, B6, B8]

# Digest fingerprint of the observed dk column spine (20 columns: B1-B10,
# B6a, B6b, B8a-B8h; no gaps) — stage2 recomputes and compares it.
section_spine: { count: 20, sha256: "87c33ef7eec84563ed467205eba72dbc52c3c41ad9b1519956395011a6b07881" }

# dk is bookless (a single declared book covers the whole spine, like the
# flat `section` scheme's Enchiridion).
books:
  - { n: 1, start: "B1", end: "B10" }

sources:
  tlg_dir_env: "TLG_DIR"
  tlg_dir_default: "../TLG Files/TLG"
  diogenes_server: "/Applications/Diogenes.app/Contents/server"
  diogenes_data: "/Applications/Diogenes.app/Contents/dependencies/data"

