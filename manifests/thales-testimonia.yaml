# Thales of Miletus Testimonia (DK 11 A) — pipeline manifest (dk scheme: one
# flat div[@type="Fragment"][@n] per citable testimonium, plain <p> prose, no
# <l> lines). Greek-only work: the A-testimonia are ancient reports/
# paraphrases about Thales, not his own words, and no free English
# translation of them exists — `english` is intentionally absent (Wave 1b
# design memo §1, §5.1's "Greek-only work mode"). No homonym risk: TLG1705 is
# the only "Thales Phil." author.
#
# NON-DK WORK EXCLUDED (task-directed appendix deferral, Empedocles-appendix
# precedent): TLG1705 carries THREE works — 001 Epistulae (ed. Hercher,
# *Epistolographi Graeci*, Paris: Didot, 1873 — its own <sourceDesc>
# confirms; PD by age but NOT a DK work, no Diels-Kranz number at all), 002
# Testimonia (this work), 003 Fragmenta. 001 is excluded from Wave 1b
# entirely, same posture as Empedocles' non-DK appendix works (CANON.md §1)
# — it could join later as an ordinary additional work if John wants it, but
# is out of scope here and was never exported into this batch's build cache.
#
# VERSE CHECK: exported plain (no `-y`); a control `-y` export of the same
# author was run and diffed for the record — it mis-verse-broke every line
# (426 spurious <l> elements in this work alone), discarded. Zero
# structurally-marked verse (plain export: 0 `<l>` elements). No embedded
# ancient verse quotations found in this work either (unlike several other
# Wave 1b testimonia works) — it is straight doxographic prose throughout.
#
# STRUCTURE: 31 divs, clean single-number/lettered @n, NO title div (unlike
# most other dk works in this wave — Thales Testimonia's export has no
# `n="tit..."` div at all, confirmed against the export). n=1-23 (23,
# consecutive, no gaps) plus eight lettered variants (3a, 11a, 13a, 13b,
# 13c, 17a, 17b, 22a). 23 + 8 = 31, matching the raw div count exactly.
# Task brief's stated range ("test. 1-23") matches the export's own
# numbering exactly.
#
# LETTER-SPACING FINDING (notable, CANON-log-worthy): this entire work
# carries ZERO `<hi rend="letter-spacing">` runs anywhere (verified against
# the raw export text: 0 occurrences of the string "letter-spacing" in the
# whole file, not just a per-div spot-check) — DK marks NO testimonium here
# as preserving Thales' own verbatim words. This matches the ancient
# tradition uniformly reported in these very testimonia (e.g. A1, Diog.
# Laert. I 22-44) that Thales left no writings of his own at all; every
# report about his doctrines (water as the origin of things, etc.) is later
# paraphrase/doxography, never a direct quotation DK could letter-space.
# All 31 columns are therefore `unmarked_columns` — the only Wave 1b work
# to date with a 100% unmarked A-series.

work:
  id: thales-testimonia
  title: "Testimonia"
  author: "thales"
  language: "grc"
  tlg_author: "1705"
  tlg_work: "002"
  greek_edition: "Diels, H. and Kranz, W. (eds.), Die Fragmente der Vorsokratiker, 6th ed., vol. 1 (Berlin: Weidmann, 1951–52), 11 A"
  # FATAL sourceDesc gate: stage1's _check_sourcedesc asserts this exact
  # substring is present in the export XML's own <teiHeader><sourceDesc>
  # text -- verified verbatim against build/export/.../tlg1705002.xml.
  expected_sourcedesc: 'Thales Phil., Testimonia (1705: 002) "Die Fragmente der Vorsokratiker, vol. 1'

citation:
  expand_citations: true  # DK source-citation expansion, rule E (John, 2026-09-24)
  scheme: dk
  series: A
  # dk_witness.py's owner-verified apparatus split (stage7_emit wiring):
  # count of this work's columns whose apparatus actually splits into
  # 2+ witnesses, cross-checked bidirectionally at preflight against the
  # emitted dist's own `witnesses` keys -- catches an unreviewed new
  # split and a stale declaration alike.
  dk_witness_split_columns: 6
  # Quote-mark polarity fix (owner ruling 2026-08-05, "we fix it and
  # make damn sure every instance is correct"): the raw TLG export
  # frequently opens a Greek quotation with U+2019 instead of U+2018 --
  # stage1_greek._dk_normalize_quote_marks fixes every BALANCED
  # (even-count) column automatically; this is that fix's own declared
  # count, cross-checked bidirectionally at preflight against the
  # emitted dist's actual U+2018/U+2019 total.
  dk_quote_marks_rewritten: 78
  # FAIL-CLOSED: this work's raw export carries an ODD
  # U+2018/U+2019 count in these column(s) -- cannot be paired,
  # left completely untouched by the fix above (see
  # stage1_greek._dk_normalize_quote_marks' module doc).
  dk_unbalanced_quote_columns:
    - A3a
  hideLineNumbers: true
  unmarked_columns:
    - A1
    - A2
    - A3
    - A3a
    - A4
    - A5
    - A6
    - A7
    - A8
    - A9
    - A10
    - A11
    - A11a
    - A12
    - A13
    - A13a
    - A13b
    - A13c
    - A14
    - A15
    - A16
    - A17
    - A17a
    - A17b
    - A18
    - A19
    - A20
    - A21
    - A22
    - A22a
    - A23

# Digest fingerprint of the observed dk column spine (31 columns, A1-A23
# plus eight lettered variants, no gaps) — stage2 recomputes and compares it.
section_spine: { count: 31, sha256: "d323b8672ec7739cd9b8e5a599f571ccfb82309ae7353e1a3429f77e5a57c713" }

# dk is bookless (a single declared book covers the whole spine, like the
# flat `section` scheme's Enchiridion).
books:
  - { n: 1, start: "A1", end: "A23" }

sources:
  tlg_dir_env: "TLG_DIR"
  tlg_dir_default: "../TLG Files/TLG"
  diogenes_server: "/Applications/Diogenes.app/Contents/server"
  diogenes_data: "/Applications/Diogenes.app/Contents/dependencies/data"

