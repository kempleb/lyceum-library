# Parmenides Testimonia (DK 28 A) — pipeline manifest (dk scheme: one flat
# div[@type="Fragment"][@n] per citable testimonium, no nested section div,
# no <l> lines — plain <p> prose, like Heraclitus). Greek-only work: the
# A-testimonia are ancient reports/paraphrases about Parmenides, not his own
# words, and no free English translation of them exists — `english` is
# intentionally absent (Wave 1b design memo §1, §5.1's "Greek-only work
# mode").
#
# EXPORT-SHAPE VERIFICATION (Wave 1b Parmenides integration, 2026-07-17):
# tlg1562001.xml (this work) was re-exported from a PLAIN (non-`-y`)
# Diogenes invocation, into its own outdir, per docs/tlg-phi-export.md's
# per-invocation gotcha — the export previously committed to
# build/export/.../tlg1562001.xml came from a single mixed `-y` invocation
# alongside the Fragmenta and was WRONGLY line-broken as verse (confirmed:
# 384 spurious <l n> elements under the old export; the corrected export
# carries zero, only <p> prose, matching this work's real prose testimonia).

work:
  id: parmenides-testimonia
  title: "Testimonia"
  author: "parmenides"
  language: "grc"
  tlg_author: "1562"
  tlg_work: "001"
  greek_edition: "Diels, H. and Kranz, W. (eds.), Die Fragmente der Vorsokratiker, 6th ed., vol. 1 (Berlin: Weidmann, 1951–52), 28 A"
  # FATAL sourceDesc gate (Wave 1c Sol nit, backfilled onto this committed
  # work since verifying it was trivial): stage1's _check_sourcedesc
  # asserts this exact substring is present in the export XML's own
  # <teiHeader><sourceDesc> text -- verified verbatim against
  # build/export/.../tlg1562001.xml.
  expected_sourcedesc: 'Parmenides Poet. Phil., Testimonia (1562: 001) "Die Fragmente der Vorsokratiker, vol. 1'

citation:
  scheme: dk
  series: A
  # dk_witness.py's owner-verified apparatus split (stage7_emit wiring):
  # count of this work's columns whose apparatus actually splits into
  # 2+ witnesses, cross-checked bidirectionally at preflight against the
  # emitted dist's own `witnesses` keys -- catches an unreviewed new
  # split and a stale declaration alike.
  dk_witness_split_columns: 7
  # Quote-mark polarity fix (owner ruling 2026-08-05, "we fix it and
  # make damn sure every instance is correct"): the raw TLG export
  # frequently opens a Greek quotation with U+2019 instead of U+2018 --
  # stage1_greek._dk_normalize_quote_marks fixes every BALANCED
  # (even-count) column automatically; this is that fix's own declared
  # count, cross-checked bidirectionally at preflight against the
  # emitted dist's actual U+2018/U+2019 total.
  dk_quote_marks_rewritten: 36
  hideLineNumbers: true
  # 51 of 59 testimonia carry no <hi rend="letter-spacing"> at all — an
  # even LARGER share than Heraclitus' testimonia (19 of 27): the A-series
  # is ancient doxography/biography ABOUT Parmenides, and DK's typography
  # only distinguishes a directly-quoted phrase from the surrounding report
  # when one survives at all — most entries here are pure paraphrase with
  # nothing macroscopically quotable (same verified DK6/export
  # characteristic as Heraclitus, memo §2.4/§4.2; see
  # stage1_greek._parse_fragments' role-coverage doc comment). Includes at
  # least one Latin testimonium with a genuine textual crux
  # (CENSORINUS 4,7-8's "† dissensis" — kept verbatim, `keep-latin`, in
  # sources/parmenides-testimonia/dk-context-lang.json; the † is ordinary
  # apparatus punctuation, not part of any non-Greek run).
  unmarked_columns:
    - A2
    - A3
    - A4
    - A5
    - A6
    - A7
    - A8
    - A9
    - A10
    - A11
    - A12
    - A13
    - A14
    - A15
    - A16
    - A17
    - A18
    - A19
    - A21
    - A23
    - A24
    - A25
    - A26
    - A28
    - A29
    - A30
    - A31
    - A32
    - A33
    - A35
    - A36
    - A38
    - A39
    - A40
    - A41
    - A42
    - A43
    - A43a
    - A44
    - A44a
    - A45
    - A46a
    - A46b
    - A47
    - A48
    - A49
    - A50
    - A51
    - A52
    - A53
