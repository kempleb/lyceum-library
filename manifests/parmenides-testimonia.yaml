# Digest fingerprint of the observed dk column spine (59 columns: A1..A54
# plus the lettered A40a, A43a, A44a, A46a, A46b) — stage2 recomputes and
# compares it.
section_spine: { count: 59, sha256: "62129dd22629d6a62663473d36b944c9faa2505e0414b77d8e6aff4d6d2252a2" }

# dk is bookless (a single declared book covers the whole spine, like the
# flat `section` scheme's Enchiridion).
books:
  - { n: 1, start: "A1", end: "A54" }

