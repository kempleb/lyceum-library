# Anaximenes of Miletus Testimonia (DK 13 A) — pipeline manifest (dk
# scheme: one flat div[@type="Fragment"][@n] per citable testimonium, plain
# <p> prose, no <l> lines). Greek-only work: the A-testimonia are ancient
# reports/paraphrases about Anaximenes, not his own words — `english`
# intentionally absent (Wave 1b design memo §1, §5.1's "Greek-only work
# mode"). No homonym risk: TLG0617 is the only "Anaximenes Phil." author.
#
# VERSE CHECK: exported plain (no `-y`); a control `-y` export of the same
# author was run and diffed for the record — it mis-verse-broke every line
# (149 spurious <l> elements in this work alone), discarded. Zero
# structurally-marked verse (plain export: 0 `<l>` elements). No embedded
# ancient verse quotations found either — straight prose doxography
# throughout (Cicero x2, Augustine, Pliny, all prose).
#
# STRUCTURE: 24 divs, clean single-number/lettered @n, NO title div
# (confirmed against the export, same pattern as Thales' and Anaximander's
# Testimonia). n=1-23 (23, consecutive, no gaps) plus one lettered variant
# (14a). 23 + 1 = 24, matching the raw div count exactly. Task brief's
# stated range ("test. 1-23") matches the export's own numbering exactly.
#
# German-commentary hand-review: all 41 non-Greek runs in this work are
# ordinary citation apparatus (author abbreviations, volume/page refs,
# DK's bracketed cross-references) or genuine ancient Latin quotations
# (Cicero, Augustine, Pliny) — NONE required `strip-german` (verified by
# direct reading of every run, not just the heuristic proposal; the
# Anaximander-testimonia hand-review catch above was specifically checked
# for here too and not present).

work:
  id: anaximenes-testimonia
  title: "Testimonia"
  author: "anaximenes"
  language: "grc"
  tlg_author: "0617"
  tlg_work: "001"
  greek_edition: "Diels, H. and Kranz, W. (eds.), Die Fragmente der Vorsokratiker, 6th ed., vol. 1 (Berlin: Weidmann, 1951–52), 13 A"
  # FATAL sourceDesc gate: stage1's _check_sourcedesc asserts this exact
  # substring is present in the export XML's own <teiHeader><sourceDesc>
  # text -- verified verbatim against build/export/.../tlg0617001.xml.
  expected_sourcedesc: 'Anaximenes Phil., Testimonia (0617: 001) "Die Fragmente der Vorsokratiker, vol. 1'

citation:
  scheme: dk
  series: A
  # dk_witness.py's owner-verified apparatus split (stage7_emit wiring):
  # count of this work's columns whose apparatus actually splits into
  # 2+ witnesses, cross-checked bidirectionally at preflight against the
  # emitted dist's own `witnesses` keys -- catches an unreviewed new
  # split and a stale declaration alike.
  dk_witness_split_columns: 1
  hideLineNumbers: true
  # 5 of 24 testimonia carry a letter-spaced run (verified per-div): A5,
  # A6, A7 (μάνωσιν/πύκνωσιν, ἐποχεῖσθαι, ἐποχεῖσθαι/πιλίον — the
  # rarefaction/condensation doctrine's technical vocabulary), A15 and A20
  # (ὡς πέταλον / ἐποχεῖσθαι again) — the same short technical-phrase
  # quotations reused across several citing sources, matching this
  # fragment collection's own B2/B2a content (see anaximenes-fragments.yaml).
  unmarked_columns:
    - A1
    - A2
    - A3
    - A4
    - A8
    - A9
    - A10
    - A11
    - A12
    - A13
    - A14
    - A14a
    - A16
    - A17
    - A18
    - A19
    - A21
    - A22
    - A23

# Digest fingerprint of the observed dk column spine (24 columns, A1-A23
# plus one lettered variant, no gaps) — stage2 recomputes and compares it.
section_spine: { count: 24, sha256: "bbea4041a80eabc8dcfbcf062f05ce159c1ea8cade86604c350dcc1bddc198ae" }

# dk is bookless (a single declared book covers the whole spine, like the
# flat `section` scheme's Enchiridion).
books:
  - { n: 1, start: "A1", end: "A23" }

sources:
  tlg_dir_env: "TLG_DIR"
  tlg_dir_default: "../TLG Files/TLG"
  diogenes_server: "/Applications/Diogenes.app/Contents/server"
  diogenes_data: "/Applications/Diogenes.app/Contents/dependencies/data"

registry:
  id: anaximenes-testimonia
  slug: testimonia
  title: Testimonia
  abbr: Anaximen. A
  author: anaximenes
  language: grc
  workType: fragments
  books: 1
  bookLabels:
    - '1'
  greekEdition: 'Diels, H. and Kranz, W. (eds.), Die Fragmente der Vorsokratiker, 6th ed., vol. 1 (Berlin: Weidmann, 1951–52), 13 A'
  greekSource:
    short: Diels–Kranz (1951–52)
    full: 'Diels, H. and Kranz, W. (eds.), Die Fragmente der Vorsokratiker, 6th ed., vol. 1 (Berlin: Weidmann, 1951–52), 13 A'
  translations: []
  citation:
    scheme: dk
    copyAbbr: DK 13
