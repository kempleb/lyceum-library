# Antiphon the Sophist Testimonia (DK 87 A) — pipeline manifest (dk scheme:
# one flat div[@type="Fragment"][@n] per citable testimonium, plain <p>
# prose, no <l> lines). Greek-only work: ancient reports about Antiphon,
# not his own words; no free English translation exists this wave.
#
# NOT the orator: this is TLG1147 (Antiphon Soph.), a DISTINCT TLG author
# from TLG0028 (Antiphon the orator, untouched by this wave). The two
# Antiphons' identity was already disputed in antiquity -- this very work
# preserves the ancient debate directly (A2, Hermogenes quoting Didymus:
# "there have been several Antiphons, but two who practised as sophists",
# then distinguishes the orator, credited with the homicide and public
# speeches, from the sophist/dream-interpreter credited with On Truth, On
# Concord, and the Politicus; A4 and A6 revisit the same question).
# Confirmed directly against the export's own <sourceDesc>:
# 'Antiphon Soph., Testimonia (1147: 002) "Die Fragmente der Vorsokratiker,
# vol. 2, 6th edn.", ...'.
#
# NON-DK WORKS EXCLUDED (task-directed): TLG1147 also carries 001 Fragmenta
# (Gernet, "Antiphon. Discours", Paris 1923 -- the ORATOR's edition, shared
# with TLG0028) and 005 Fragmenta (Corpus dei papiri filosofici greci e
# latini, a modern papyrological edition) -- neither is DK, both excluded,
# never export-referenced by any manifest.
#
# VERSE CHECK: exported plain (no `-y`); confirmed 0 <l> elements anywhere
# in the export (two-invocation comparison, docs/tlg-phi-export.md --
# forcing -y on this author produces artificial print-line chopping of
# ordinary prose narrative, confirmed by direct content reading).
#
# STRUCTURE: 9 divs, n="1".."9" (consecutive, no gaps, no lettered
# variants). No title divs, no div_map/div_concat/compound_n_map cases.
#
# LETTER-SPACING FINDING: 3 of 9 columns carry at least one
# <hi rend="letter-spacing"> span (A1: the dream-book's Greek title,
# a work-title cross-ref; A2: four work-title cross-refs; A6: two
# work-title cross-refs). 6 columns are pure doxography/biography with no
# letter-spacing at all — declared `unmarked_columns` below,
# content-verified per column: A3, A4, A5, A7, A8, A9.
#
# LATIN: none found — every marked role='text' span in this work is Greek
# (all four work-title cross-references above are Greek titles).
#
# DAMAGE DOTS: none found.
work:
  id: antiphon-sophist-testimonia
  title: "Testimonia"
  author: "antiphon-sophist"
  language: "grc"
  tlg_author: "1147"
  tlg_work: "002"
  greek_edition: "Diels, H. and Kranz, W. (eds.), Die Fragmente der Vorsokratiker, 6th ed., vol. 2 (Berlin: Weidmann, 1952), 87 A"
  # FATAL sourceDesc gate: stage1's _check_sourcedesc asserts this exact
  # substring is present in the export XML's own <teiHeader><sourceDesc>
  # text -- verified verbatim against build/export/.../tlg1147002.xml.
  expected_sourcedesc: 'Antiphon Soph., Testimonia (1147: 002) "Die Fragmente der Vorsokratiker, vol. 2'

citation:
  expand_citations: true  # DK source-citation expansion, rule E (John, 2026-09-24)
  scheme: dk
  series: A
  # dk_witness.py's owner-verified apparatus split (stage7_emit wiring):
  # count of this work's columns whose apparatus actually splits into
  # 2+ witnesses, cross-checked bidirectionally at preflight against the
  # emitted dist's own `witnesses` keys -- catches an unreviewed new
  # split and a stale declaration alike.
  dk_witness_split_columns: 1
  # Quote-mark polarity fix (owner ruling 2026-08-05, "we fix it and
  # make damn sure every instance is correct"): the raw TLG export
  # frequently opens a Greek quotation with U+2019 instead of U+2018 --
  # stage1_greek._dk_normalize_quote_marks fixes every BALANCED
  # (even-count) column automatically; this is that fix's own declared
  # count, cross-checked bidirectionally at preflight against the
  # emitted dist's actual U+2018/U+2019 total.
  dk_quote_marks_rewritten: 4
  hideLineNumbers: true
  unmarked_columns:
    - A3
    - A4
    - A5
    - A7
    - A8
    - A9

# Digest fingerprint of the observed dk column spine (9 columns, A1-A9, no
# gaps) — stage2 recomputes and compares it.
section_spine: { count: 9, sha256: "dee99dfb6263aa81e71cf1bd6a0ba0f56cfe987debdfe4a00d7086e0d2e29dcd" }

# dk is bookless (a single declared book covers the whole spine, like the
# flat `section` scheme's Enchiridion).
books:
  - { n: 1, start: "A1", end: "A9" }

sources:
  tlg_dir_env: "TLG_DIR"
  tlg_dir_default: "../TLG Files/TLG"
  diogenes_server: "/Applications/Diogenes.app/Contents/server"
  diogenes_data: "/Applications/Diogenes.app/Contents/dependencies/data"

