    model: freeman
    file: "freeman-ancilla/freeman-democritus.clean.json"
    license:
      status: public-domain-us
      rationale: "Kathleen Freeman's Ancilla to the Pre-Socratic Philosophers (1948) is treated as US public domain per John's 2026-07-23 ruling (CANON.md, Freeman Ancilla copyright ruling); covered by attribution.astro's site-wide translation public-domain notice."
    group_headers_file: "freeman-ancilla/freeman-democritus.group_headers.json"
  # John's ruling 2026-07-29: each of these is Freeman's own wholly
  # parenthetical précis of a reporting source, with no translated
  # context-english span covering the same material -- labeled a summary
  # rather than suppressed (stage1_freeman_english.py gate 5; see
  # EnglishChunk.summary). B10a and B14 were census edge cases (a leading
  # parenthetical tag/group header followed by unrelated prose, not
  # WHOLLY parenthetical) and are deliberately NOT declared here.
  summary_labels:
    [B12, B13, B16, B17, B20, B24, B28, B29a, B122a, B155a, B161, B162, B163,
     B299h, B308]
# title-strip and the two div_concat merges) -- stage2 recomputes and
# compares it.
section_spine: { count: 386, sha256: "18820fba5c2384209e676db041d25f9c32136753146c1f12abeb746e70b61bea" }

# dk is bookless (a single declared book covers the whole spine, like the
# flat `section` scheme's Enchiridion). Spine starts at B0a, not B1: DK's
# own numbering opens with three lettered book-title entries (B0a
# "Pythagoras", B0b "On the Disposition of the Wise Man", B0c "On Things in
# Hades") preceding the numbered run -- there is no plain "B0".
books:
  - { n: 1, start: "B0a", end: "B309" }

