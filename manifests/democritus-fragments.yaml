# Democritus Fragments (DK 68 B) — pipeline manifest (dk scheme: one flat
# div[@type="Fragment"][@n] per citable fragment, no nested section div).
# The LARGEST dk corpus in the collection: 420 raw export divs -> 386
# citable columns after title-strip (7 divs) and TWO div_concat merges
# (below). Includes the ethical gnomai (the Democrates/"Gnomai" collection,
# roughly B35-B115 under the stripped `tit,35-115` heading) -- hundreds of
# short one-line sayings, the great majority wholly letter-spaced (a
# one-liner whose ENTIRE content is marked needs no verse declaration: this
# is a prose work, so role derives directly from the `rend="letter-spacing"`
# markup, confirmed by direct per-div reading of every div's raw markup,
# not a statistical guess) -- and the B298-B309 dubious/spurious tail
# (titles of lost/pseudonymous works, the Bolos-Democritean "Cheirokmeta"
# magical-medical dubia, and a handful of gnomologion entries).
#
# TITLE DIVS (7, stripped, matching `_DK_TITLE_N_RE`): "tit,0a-4a",
# "tit,4b-11a", "tit,11b-11k", "tit,11l-15b", "tit,15c-26a", "tit,26b-28c",
# "tit,35-115" -- DK's own thematic section headers within the B-collection
# (Diels grouped the fragments into named subsections: Cosmology/
# epistemology-adjacent groups B1-B34, then the long Ethics/Gnomai run
# B35-B115). No content beyond a Greek section-title label in any of the
# seven (content-verified).
#
# NEW citation.div_concat cases (not anticipated by the design memo or the
# Xenophanes A28 precedent -- CANON-log-worthy, flagged for review rather
# than improvised into new citation grammar):
#
#   B14 -- EIGHT export divs (n="14,1".."14,8"), NO plain "14" div at all.
#   Content-verified: eight DIFFERENT ancient sources (Vitruvius, Eudoxus'
#   astronomical canon, Geminus, Pliny, a Scholiast on Apollonius Rhodius,
#   Lydus quoting the Clodian Calendar, Ptolemy's Phaseis, Lydus' De
#   Mensibus) each preserving isolated data-points -- star risings, weather
#   signs, calendar dates -- from Democritus' lost astronomical work (his
#   "Parapegma"). Unlike Xenophanes A28 (five parts of ONE continuous
#   Ps.-Aristotle passage), these eight parts are NOT textually continuous;
#   they are thematically unified fragments of a single lost work that DK
#   prints under ONE heading "14" with internal (1)-(8) apparatus numbering
#   -- not, so far as this reading could confirm, independently-cited DK
#   sub-numbers. Filed as one column B14 via div_concat.
#
#   B300 -- a plain "300" div (DK's own section-title/heading line, "Bolos'
#   Cheirokmeta and Physika Dynamera") PLUS twenty export divs comma-numbered
#   "300,1".."300,20" (with three further-lettered "300,4a"/"300,7a"/
#   "300,13a") -- the Bolos-Democritean pseudepigraphic dubia (magical/
#   medical "Cheirokmeta"), each an independent ancient witness (Suda,
#   Vitruvius, Columella, Pliny, Seneca, Galen, papyri, etc.) to a
#   DIFFERENT specific claim. Genuinely more heterogeneous than B14, and
#   the comma-numbering shape ("300,N") mirrors DK's own printed page
#   notation closely enough that a case CAN be made these deserve
#   independently-citable tokens ("68 B300,14" is attested in some
#   secondary literature for the Seneca arch/vault anecdote at 300,14) --
#   an open citation-grammar question (would need a new comma-joined
#   column-suffix grammar, analogous to the existing dot-joined verse-line
#   form) that this wave does NOT resolve unilaterally. Filed as one
#   column B300 via div_concat (title div "300" as the leading part) as the
#   conservative, non-improvised disposition that ships the content
#   complete and readable; flagged for an Opus/John citation-grammar
#   decision on whether to split it into independently addressable
#   "B300,N" tokens later. Neither disposition loses any content either way.
#
# B14a/B14b/B14c and B298/B298a/B298b/B299a-B299h: ORDINARY columns (each
# its own div, normal digit+letter grammar) -- short one-line titles of
# further lost works (e.g. "ΟΥΡΑΝΟΓΡΑΦΙΗ", "ΓΕΩΓΡΑΦΙΗ") with no further
# content; declared `unmarked_columns` below like any other title-only
# fragment, no special merge needed.

