# Freeman’s fifth-edition B16c is DK6 B15c. The five English-only
# entries below were excluded from the committed clean JSON. DK B131 was
# a false edition gap: sacred-texts prints its leading label as a scan
# typo, `13I.` (capital I for the digit 1), which merged its text into
# B130 until the extractor's numbering-typo correction was extended to
# this class (I/l-for-1, accepted only as the exact expected successor).
# Freeman coverage is complete: 386 of 386 columns.
