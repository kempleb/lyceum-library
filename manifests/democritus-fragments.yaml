  id: democritus-fragments
  title: "Fragments"
  author: "democritus"
  language: "grc"
  tlg_author: "1304"
  tlg_work: "002"
  greek_edition: "Diels, H. and Kranz, W. (eds.), Die Fragmente der Vorsokratiker, 6th ed., vol. 2 (Berlin: Weidmann, 1951–52), 68 B"
  # FATAL sourceDesc gate -- verified verbatim against
  # build/export/.../tlg1304002.xml (DK vol. 2, atomists).
  expected_sourcedesc: 'Democritus Phil., Fragmenta (1304: 002) "Die Fragmente der Vorsokratiker, vol. 2'

