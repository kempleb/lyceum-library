  greekSource:
    short: Diels–Kranz (1952)
    full: 'Diels, H. and Kranz, W. (eds.), Die Fragmente der Vorsokratiker, 6th ed., vol. 2 (Berlin: Weidmann, 1952), 86 A'
  translations: []
