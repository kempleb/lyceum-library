# Hippias of Elis Testimonia (DK 86 A) — pipeline manifest (dk scheme: one
# flat div[@type="Fragment"][@n] per citable testimonium, plain <p> prose,
# no <l> lines). Greek-only work: ancient reports/paraphrases about
# Hippias, not his own words; no free English translation exists this wave
# (Burnet never covers the Sophists — sophists batch 2, same posture as
# batch 1's Protagoras/Gorgias/Prodicus).
#
# FIRST DK VOL. 2 WORK OF THIS BATCH (task-directed): DK vol. 2 (1952),
# chapter 86. Confirmed directly against the export's own <sourceDesc>:
# 'Hippias Soph., Testimonia (1434: 003) "Die Fragmente der Vorsokratiker,
# vol. 2, 6th edn.", ...'.
#
# NON-DK WORKS EXCLUDED (task-directed): TLG1434 also carries 001 Testimonia
# and 002 Fragmenta, both sourced "FGrH 6" (Jacoby's Fragmente der
# griechischen Historiker) — NOT DK, excluded, never export-referenced by
# any manifest. TLG1435 (Hippias the historian, a different author) is
# untouched.
#
# VERSE CHECK: exported plain (no `-y`); confirmed 0 <l> elements anywhere
# in the export (the export's own heuristic already labelled both this work
# and 004 Fragmenta "prose" without forcing -- confirmed by direct content
# reading, not merely trusted: forcing -y on this author (scratch two-
# invocation comparison, docs/tlg-phi-export.md) produces artificial
# print-line chopping of ordinary Diogenes Laertius/Philostratus prose
# narrative with no metrical content at all -- the plain export is correct).
#
# STRUCTURE: 17 divs, n="1".."16" plus the lettered "5a" (an independently-
# existing div, not a merge). No title divs, no div_map/div_concat/
# compound_n_map cases (no comma-numbered or multi-part @n values anywhere
# in this work). No gaps.
#
# LETTER-SPACING FINDING: 3 of 17 columns carry at least one
# <hi rend="letter-spacing"> span (A2, A11, A12 — verbatim phrases embedded
# in the doxography/biography, e.g. A2's mnemonic-subject list, A11's
# lengthy catalogue of Hippias' self-made regalia). 14 columns are pure
# doxography/biography with no letter-spacing at all — declared
# `unmarked_columns` below, content-verified per column: A1, A3, A4, A5,
# A5a, A6, A7, A8, A9, A10, A13, A14, A15, A16.
#
# LATIN: none found — every marked role='text' span in this work is Greek.
#
# DAMAGE DOTS: none found — no literal ASCII periods glued to Greek letters
# anywhere in the export (checked directly, both upper- and lower-case
# scoped).
work:
  id: hippias-testimonia
  title: "Testimonia"
  author: "hippias"
  language: "grc"
  tlg_author: "1434"
  tlg_work: "003"
  greek_edition: "Diels, H. and Kranz, W. (eds.), Die Fragmente der Vorsokratiker, 6th ed., vol. 2 (Berlin: Weidmann, 1952), 86 A"
  # FATAL sourceDesc gate: stage1's _check_sourcedesc asserts this exact
  # substring is present in the export XML's own <teiHeader><sourceDesc>
  # text -- verified verbatim against build/export/.../tlg1434003.xml.
  expected_sourcedesc: 'Hippias Soph., Testimonia (1434: 003) "Die Fragmente der Vorsokratiker, vol. 2'

citation:
  scheme: dk
  series: A
  # dk_witness.py's owner-verified apparatus split (stage7_emit wiring):
  # count of this work's columns whose apparatus actually splits into
  # 2+ witnesses, cross-checked bidirectionally at preflight against the
  # emitted dist's own `witnesses` keys -- catches an unreviewed new
  # split and a stale declaration alike.
  dk_witness_split_columns: 1
  hideLineNumbers: true
  unmarked_columns:
    - A1
    - A3
    - A4
    - A5
    - A5a
    - A6
    - A7
    - A8
    - A9
    - A10
    - A13
    - A14
    - A15
    - A16

# Digest fingerprint of the observed dk column spine (17 columns, A1-A16
# plus A5a, no gaps) — stage2 recomputes and compares it.
section_spine: { count: 17, sha256: "029ec502cc7c43359839abeb9d7f47af072cc07f421df56242acaf67ec888b98" }

# dk is bookless (a single declared book covers the whole spine, like the
# flat `section` scheme's Enchiridion).
books:
  - { n: 1, start: "A1", end: "A16" }

sources:
  tlg_dir_env: "TLG_DIR"
  tlg_dir_default: "../TLG Files/TLG"
  diogenes_server: "/Applications/Diogenes.app/Contents/server"
  diogenes_data: "/Applications/Diogenes.app/Contents/dependencies/data"

registry:
  id: hippias-testimonia
  slug: testimonia
  title: Testimonia
