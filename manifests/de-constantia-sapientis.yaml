  title: De Constantia Sapientis
  abbr: Const.
  author: seneca
  language: lat
  workType: continuous
  # John's ruling, 2026-09-12: a single dialogue stored as 19 PHI chapters,
  # not real books -- the reader chrome and the /read/.../chapter-N URL both
  # come from this field (shared/lib/works.ts's divisionId).
  divisionNoun: chapter
  books: 19
  bookLabels:
    - '1'
    - '2'
    - '3'
    - '4'
    - '5'
    - '6'
    - '7'
    - '8'
    - '9'
