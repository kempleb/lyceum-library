# De Constantia Sapientis — pipeline manifest (Wave 2 Seneca essays, docs/
# wave2-seneca-design.md §E: per-essay reader work on the book-section
# scheme, PHI chapter mapped to the page axis and PHI section to the
# column). This essay = Dialogi (PHI 1017/012) book 2 (Reynolds' physical
# liber, verified against the untracked export at build/phi-test/out-
# seneca/Diogenes-Resources/xml/phi/phi1017012.xml). `citation.source_book`
# (the design note's new mechanism, stage1_latin.py's
# `_resolve_source_book`/`_parse_book_section`) scopes the walk to book 2
# alone — book 2 is clean: no non-digit sections, no cross-section
# print-line hyphen wraps (verified 0) — so this manifest carries neither
# `merge_sections` (the De Ira I doublet fix, §E.4, out of scope here) nor a
# nonzero `cross_section_rejoins`. See manifests/de-providentia.yaml
# (Dialogi book 1) for the sibling essay sharing this mechanism.
#
# Latin-only staging (no_english, the De Officiis/De Rerum Natura
# precedent): text, citation, search, and the lexicon layer only — Basore's
# English (LCL 214, 1928) is a separate John gate (design note §F/§J.1).

work:
  id: de-constantia-sapientis
  title: "De Constantia Sapientis"
  author: "seneca"
  language: "lat"
  lexicon: true
  no_english: true
  phi_author: "1017"
  phi_work: "012"
  latin_edition: "Reynolds, L. D. (ed.), L. Annaei Senecae Dialogorum Libri Duodecim (Oxford: Clarendon Press, 1977)"
  # FATAL sourceDesc gate (De Officiis precedent): verified verbatim against
  # the real PHI export (build/phi-test/out-seneca/Diogenes-Resources/xml/
  # phi/phi1017012.xml) — this is the whole-file Dialogi sourceDesc (shared
  # by every essay drawn from this file, see manifests/de-providentia.yaml),
  # not a per-book one.
  expected_sourcedesc: 'L. Annaeus Seneca iunior. Dialogi (L. Annaei Senecae Dialogorum Libri Duodecim, ed. L. D. Reynolds, 1977). (1017: 012)'

citation:
  scheme: book-section
  hideLineNumbers: true
  # NEW mechanism (design note §E.3): scope the walk to Dialogi book 2
  # alone — see manifests/de-providentia.yaml's matching comment for the
  # full mechanism description.
  source_book: "2"
  div_types:
    page: "chapter"
    section: "section"
  # Verified against the real export: 0 print-line hyphen wraps in book 2
  # (De Constantia Sapientis has 19 chapters, 85 sections total) — declared
  # as a re-export drift tripwire like every other Latin book-section work.
  cross_section_rejoins: 0
  # Declared title-drop hash: book 2's own per-book chapter n="t" heading —
  # the ONLY title div this essay's scoped walk ever visits.
  title_labels:
    - { sha256_16: "7143859cd51e4dc5", note: "book 2 (De Constantia Sapientis) chapter heading (chapter n=\"t\")" }

# Digest fingerprint of the observed chapter.section column spine (85
# columns, 1.1..19.4: chapters 1-19 hold 3,3,5,3,7,8,6,3,5,4,3,3,5,4,5,4,4,
# 6,4 sections respectively) -- stage2 recomputes and compares it. Computed
# directly against the real PHI export via stage1_latin's own
# _parse_book_section (source_book="2").
section_spine: { count: 85, sha256: "a974da200e64a25d0dbbb32f5381270124813228af0a622cc4bd13ab0bc465fb" }

books:
  - { n: 1, start: "1.1", end: "1.3" }
  - { n: 2, start: "2.1", end: "2.3" }
  - { n: 3, start: "3.1", end: "3.5" }
  - { n: 4, start: "4.1", end: "4.3" }
  - { n: 5, start: "5.1", end: "5.7" }
