  - { n: 9, start: "9.1", end: "9.5" }
  - { n: 10, start: "10.1", end: "10.4" }
  - { n: 11, start: "11.1", end: "11.3" }
  - { n: 12, start: "12.1", end: "12.3" }
  - { n: 13, start: "13.1", end: "13.5" }
  - { n: 14, start: "14.1", end: "14.4" }
  - { n: 15, start: "15.1", end: "15.5" }
  - { n: 16, start: "16.1", end: "16.4" }
  - { n: 17, start: "17.1", end: "17.4" }
  - { n: 18, start: "18.1", end: "18.6" }
  - { n: 19, start: "19.1", end: "19.4" }

sources:
  phi_dir_env: "PHI_DIR"
  phi_dir_default: "../TLG Files/PHI"
  diogenes_server: "/Applications/Diogenes.app/Contents/server"
  diogenes_data: "/Applications/Diogenes.app/Contents/dependencies/data"

