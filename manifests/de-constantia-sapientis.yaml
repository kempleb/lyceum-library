    linedGreek: true
    copyAbbr: Sen. Const.
  blurb: A defense, addressed to the young Stoic Serenus, of the paradox that the sage cannot be injured or insulted — wrongdoing may touch his body or his property, Seneca argues, but never the constancy of the wise mind itself.
