# Leucippus Testimonia (DK 67 A) — pipeline manifest (dk scheme: one flat
# div[@type="Fragment"][@n] per citable testimonium, no nested section div —
# see pipeline/reader_pipeline/scheme.py's `dk` entry for the verified TEI
# shape). Greek-only work: the A-testimonia are ancient reports/paraphrases
# about Leucippus, not his own words. Burnet's atomist chapter ("Leukippos
# of Miletos", EGP 3rd ed. 1920, djvu pp. 344-363, i.e. Wikisource
# `Page:Early Greek philosophy by John Burnet, 3rd edition, 1920.djvu/344`
# through `/363`) is CONTINUOUS NARRATIVE PROSE with no `<section
# begin="DKn">` Wikisource tags anywhere in the chapter (checked directly
# against the chapter's own wikitext, sampled across its full page range —
# same finding as the Milesian batch's Ch. I) — no fragment-by-fragment
# translation apparatus exists to extract. Ships Greek-only, deferred to
# the queued #48 Burnet alignment wave, exactly like the Milesian batch's
# testimonia-primary works. CANON-log-worthy.

work:
  id: leucippus-testimonia
  title: "Testimonia"
  author: "leucippus"
  language: "grc"
  tlg_author: "1461"
  tlg_work: "001"
  greek_edition: "Diels, H. and Kranz, W. (eds.), Die Fragmente der Vorsokratiker, 6th ed., vol. 2 (Berlin: Weidmann, 1951–52), 67 A"
  # FATAL sourceDesc gate (Wave 1c Sol nit precedent, applied at write time
  # since verifying it was trivial): stage1's _check_sourcedesc asserts this
  # exact substring is present in the export XML's own <teiHeader><sourceDesc>
  # text -- verified verbatim against build/export/.../tlg1461001.xml (note
  # DK vol. 2, unlike the physicists' vol. 1 -- the atomists sit in DK's
  # second volume).
  expected_sourcedesc: 'Leucippus Phil., Testimonia (1461: 001) "Die Fragmente der Vorsokratiker, vol. 2'

citation:
  scheme: dk
  series: A
  # dk_witness.py's owner-verified apparatus split (stage7_emit wiring):
  # count of this work's columns whose apparatus actually splits into
  # 2+ witnesses, cross-checked bidirectionally at preflight against the
  # emitted dist's own `witnesses` keys -- catches an unreviewed new
  # split and a stale declaration alike.
  dk_witness_split_columns: 5
  hideLineNumbers: true
  # 28 of 37 testimonia carry no <hi rend="letter-spacing"> at all -- a
  # verified DK6/export characteristic matching the Heraclitus/Milesian
  # precedent (ancient reports/paraphrases about a philosopher routinely
  # have nothing typographically marked as his own words), not a parser
  # gap. Every div individually read (small corpus, no heuristic used).
  unmarked_columns:
    - A2
    - A3
    - A4
    - A5
    - A7
    - A9
    - A11
    - A12
    - A13
    - A16
    - A17
    - A18
    - A19
    - A20
    - A21
    - A22
    - A25
    - A26
    - A27
    - A29
    - A30
    - A31
    - A32
    - A33
    - A34
    - A35
    - A36
    - A37
  # A8, A11 carry Latin ancient-source quotations (Cicero) inside their
  # (unmarked) context -- no role='text' block on either column, so no
  # latin_fragments declaration is needed (that declaration only applies
  # to a column whose CITABLE role='text' span is itself Latin; here the
  # Latin sits entirely in the surrounding, non-citable context).

# Digest fingerprint of the observed dk column spine (37 columns, A1-A37,
# no lettered variants, no gaps -- the cleanest spine of any dk work built
# so far) -- stage2 recomputes and compares it.
section_spine: { count: 37, sha256: "d9d66049fffcc5cdbf68080ed710953d67b400e5082c46d4f5fa4086f3c73329" }

# dk is bookless (a single declared book covers the whole spine, like the
# flat `section` scheme's Enchiridion).
books:
  - { n: 1, start: "A1", end: "A37" }

sources:
  tlg_dir_env: "TLG_DIR"
  tlg_dir_default: "../TLG Files/TLG"
  diogenes_server: "/Applications/Diogenes.app/Contents/server"
  diogenes_data: "/Applications/Diogenes.app/Contents/dependencies/data"

