# Philolaus of Croton Testimonia (DK 44 A) — pipeline manifest (dk scheme:
# one flat div[@type="Fragment"][@n] per citable testimonium, plain <p>
# prose, no <l> lines). Greek-only work: the A-testimonia are ancient
# reports/paraphrases about Philolaus, not his own words, and no free
# English translation of them exists — `english` is intentionally absent
# (Wave 1b design memo §1, §5.1's "Greek-only work mode"). No homonym risk:
# TLG1596 is the only "Philolaus Phil." author.
#
# GROUND-TRUTH CORRECTION (verified against the export, not assumed from
# the task brief's recon): the brief's recon estimated "31 fragment divs,
# ... n='1'…'29' incl. 1a/4a/7a". The export's actual div count is 32 —
# n="1".."29" (29, consecutive, no gaps) plus THREE lettered variants (1a,
# 4a, 7a): 29 + 3 = 32, matching the raw div count exactly (confirmed by an
# exhaustive `grep -c` sweep, not a recount of the recon's prose). Same
# "task brief's count was an approximation, the export is the ground truth"
# pattern noted in Melissus/Anaxagoras' manifests.
#
# VERSE CHECK: exported plain (no `-y`; the export's own log line confirms
# "Testimonia (prose)"). Zero structurally-marked verse (0 `<l>` elements).
# One embedded ancient VERSE quotation, unmarked (context, not role='text'):
# n="1" carries Diogenes Laertius' own three-couplet epigram on Philolaus'
# death, plain-exported as prose lines with no <l> markup — same "verse
# quoted inside a prose scheme renders as prose text" posture as Pythagoras
# testimonium n="6"'s Arimnestos epigram.
#
# STRUCTURE: 32 divs, n="1".."29" (no gaps) plus 1a/4a/7a. No title div.
# No div_map/div_concat cases (no comma-numbered or multi-part @n anywhere).
#
# LETTER-SPACING FINDING: 12 of 32 columns carry at least one
# <hi rend="letter-spacing"> span (A1, A8, A9, A10, A11, A12, A13, A16, A17,
# A24, A25, A26); the other 20 are pure doxography/paraphrase and are
# declared `unmarked_columns` below (verified by a per-div sweep of the
# literal "letter-spacing" string, not a heuristic).
#
# LATIN: A26 (BOËTHIUS Inst. mus. III 5, on Philolaus' division of the
# tone) is ENTIRELY Latin — no Greek anywhere in the div — yet DK
# letter-spaces three Latin technical terms Boethius reports as Philolaus'
# own coinages (apotomen, diesin, comma — Latin transliterations of Greek
# ἀποτομή/δίεσις/κόμμα, since Boethius' Latin paraphrase is the only witness
# to this passage). Zero Greek tokens in its role='text' content by
# construction, not an extraction failure (design memo §4.4) — declared in
# `latin_fragments` below, same B4/B28 precedent as Heraclitus/Democritus.

work:
  id: philolaus-testimonia
  title: "Testimonia"
  author: "philolaus"
  language: "grc"
  tlg_author: "1596"
  tlg_work: "001"
  greek_edition: "Diels, H. and Kranz, W. (eds.), Die Fragmente der Vorsokratiker, 6th ed., vol. 1 (Berlin: Weidmann, 1951–52), 44 A"
  # FATAL sourceDesc gate: stage1's _check_sourcedesc asserts this exact
  # substring is present in the export XML's own <teiHeader><sourceDesc>
  # text -- verified verbatim against build/export/.../tlg1596001.xml.
  expected_sourcedesc: 'Philolaus Phil., Testimonia (1596: 001) "Die Fragmente der Vorsokratiker, vol. 1'

citation:
  expand_citations: true  # DK source-citation expansion, rule E (John, 2026-09-24)
  scheme: dk
  series: A
  # dk_witness.py's owner-verified apparatus split (stage7_emit wiring):
  # count of this work's columns whose apparatus actually splits into
  # 2+ witnesses, cross-checked bidirectionally at preflight against the
  # emitted dist's own `witnesses` keys -- catches an unreviewed new
  # split and a stale declaration alike.
  dk_witness_split_columns: 4
  # Quote-mark polarity fix (owner ruling 2026-08-05, "we fix it and
  # make damn sure every instance is correct"): the raw TLG export
  # frequently opens a Greek quotation with U+2019 instead of U+2018 --
  # stage1_greek._dk_normalize_quote_marks fixes every BALANCED
  # (even-count) column automatically; this is that fix's own declared
  # count, cross-checked bidirectionally at preflight against the
  # emitted dist's actual U+2018/U+2019 total.
  dk_quote_marks_rewritten: 6
  hideLineNumbers: true
  unmarked_columns:
    - A1a
    - A2
    - A3
    - A4
    - A4a
    - A5
    - A6
    - A7
    - A7a
    - A14
    - A15
    - A18
    - A19
    - A20
    - A21
    - A22
    - A23
    - A27
    - A28
    - A29
  latin_fragments:
    - A26

# Digest fingerprint of the observed dk column spine (32 columns, A1-A29
# plus A1a/A4a/A7a, no gaps) — stage2 recomputes and compares it.
section_spine: { count: 32, sha256: "dc8043c5270cfe6edaf0923f57aed7d8f7081b2a1cbf0d0f11c0870334d3110d" }

# dk is bookless (a single declared book covers the whole spine, like the
# flat `section` scheme's Enchiridion).
books:
  - { n: 1, start: "A1", end: "A29" }

sources:
  tlg_dir_env: "TLG_DIR"
  tlg_dir_default: "../TLG Files/TLG"
  diogenes_server: "/Applications/Diogenes.app/Contents/server"
  diogenes_data: "/Applications/Diogenes.app/Contents/dependencies/data"

