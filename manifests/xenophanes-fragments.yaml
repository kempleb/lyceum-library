section_spine: { count: 44, sha256: "43e0540058da69f68ba2ed73b69f3757ed2a60a947e9413dd67d3f268246a0bb" }

# Freeman Ancilla wave phase 1b: Freeman is the primary/default English;
# Burnet is retained as the secondary translation overlay.
english:
  primary:
    id: freeman
    name: "Kathleen Freeman, Ancilla to the Pre-Socratic Philosophers (Blackwell, 1948)"
    model: freeman
    file: "freeman-ancilla/freeman-xenophanes.clean.json"
    license:
      status: public-domain-us
      rationale: "Kathleen Freeman's Ancilla to the Pre-Socratic Philosophers (1948) is treated as US public domain per John's 2026-07-23 ruling (CANON.md, Freeman Ancilla copyright ruling); covered by attribution.astro's site-wide translation public-domain notice."
    group_headers_file: "freeman-ancilla/freeman-xenophanes.group_headers.json"
  # John's ruling 2026-07-29: B20 is Freeman's own wholly parenthetical
  # précis of a reporting source, with no translated context-english span
  # covering the same material -- labeled a summary rather than suppressed
  # (stage1_freeman_english.py gate 5; see EnglishChunk.summary).
  summary_labels: [B20]
  secondary:
    id: burnet
    name: "John Burnet, Early Greek Philosophy, 3rd ed. (A. & C. Black, 1920)"
    model: archive
    file: "burnet-egp/burnet-xenophanes.clean.json"
    license:
      status: public-domain-us
      rationale: "Asserted US public domain by attribution.astro's site-wide translation notice: every translation listed there is United States public domain."

# Burnet EGP 3rd ed. (1920, Wikisource) -- extracted
# by pipeline/tools/extract_burnet_wikisource.py's `build_xenophanes`
# (Ch. II "Science and Religion", second half, SS55-62; NOT its own
# chapter -- Burnet covers Xenophanes as the second topic of the chapter
# also covering Pythagoras). Numbering: heading-driven like Parmenides
# (Burnet's own preface "I give the fragments according to the text and
# arrangement of Diels", no per-fragment DK tags); 29 of 31 headings
# identify directly with the DK6 number, two do not (a second, independent
# confirmation of the Parmenides-pilot defect class: Burnet's numeral
# predates DK6) -- content-verified declared remap `_XENOPHANES_NUMERAL_
# REMAP` (his (4)->B5, (5)->B6). Heading "(8)" is a cross-reference
# ("See p. 114.") to a separately-tagged real translation quoted earlier in
# the biographical narrative (Wikisource's own `XenoFragB` tag) -- excluded
# from the heading scan and re-attached to B8 directly. See the extractor's
# module doc for full evidence.

# 12 spine columns Burnet's translation does not cover (verified against
# burnet-xenophanes.clean.json's own 32-key set: B1-B3,B5-B12,B14-B16,B18,
# B22,B23-B38) -- his 3rd ed. (1920) follows a pre-DK6 arrangement that
# simply has no numbered entry at all for these (his listing's last heading
# is (38); nothing corresponds to DK6's B39-42/45, added or renumbered
# later). Genuine edition gaps, matching the exact set that also carries no
# role='text' block at all (citation.unmarked_columns) EXCEPT B17, B20,
# B42, B45, which ARE real citable verse (declared verse_text_lines) that
# Burnet's edition simply never reached -- ships Greek-only, like
# Parmenides' B15a/B20-25. B22 is NO LONGER in this list (Grok review
# defect G2): Burnet DOES translate it -- "This is the sort of thing we
# should say by the fireside in the winter-time..." (content-verified
# against the Greek, πὰρ πυρὶ χρὴ τοιαῦτα λέγειν χειμῶνος ἐν ὥρηι...),
# embedded in the biographical narrative like B8's own quotation, never
# wrapped in a Wikisource `<section>` tag of its own -- re-attached via the
# same content-verified discipline as B8 (see
# tools/extract_burnet_wikisource.py's `_xeno_reattach_tagged_fragment` /
# WIKISOURCE-PATCHES.json).
alignment_allow_unmatched_secondary:
  - "1:B4"
  - "1:B13"
  - "1:B17"
  - "1:B19"
  - "1:B20"
  - "1:B21"
  - "1:B21a"
  - "1:B39"
  - "1:B40"
  - "1:B41"
  - "1:B42"
  - "1:B45"

# Freeman's fifth-edition chapter ends at B41; DK6 adds B42 and B45.
# These are genuine primary-edition gaps, not silently dropped columns.
alignment_allow_unmatched:
  - "1:B42"
  - "1:B45"

# dk is bookless (a single declared book covers the whole spine, like the
# flat `section` scheme's Enchiridion).
books:
  - { n: 1, start: "B1", end: "B45" }

