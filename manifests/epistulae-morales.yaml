# Genuine edition-level section-boundary difference, not an extraction bug:
# Gummere's source text (Hense's 1898 Teubner) draws one fewer section
# boundary in Letter 108 than this project's Latin spine (Reynolds' 1965
# OCT) -- English's own final section (108.38, ending "...Farewell.") is
# the true end of the letter, with Latin's 108.39 folded into it with no
# separate marker. Cross-checked via per-section English/Latin word-count
# ratios (English-38-alone against Latin-38-alone would be an outlying
# 3.5x; against Latin 38+39 combined it is 1.79x, matching this letter's
# own established ~1.7-2x range) -- see
# pipeline/tools/extract_gummere_wikisource.py's module docstring for the
# full analysis (the same "declared gap, cross-checked by word-count
# proportionality" discipline as De Divinatione's 1:25 gap).
alignment_allow_unmatched:
  - "108:108.39"

# Digest fingerprint of the observed letter.section column spine (2140
# columns, 1.1..124.24) -- stage2 recomputes and compares it. Computed
# directly against the real PHI export via stage1_latin's own
# _parse_letters.
section_spine: { count: 2140, sha256: "8d97226d6e0a8ea6c90917e1ae5482cb8f571a961fd84c1cee79db00a908e361" }

