# Epistulae Morales ad Lucilium -- pipeline manifest (Wave 2 Seneca, docs/
# wave2-seneca-design.md §A-D: the new `letter` scheme -- letter = page
# axis, section = column, byte-identical dotted grammar to book-section).
# Verified directly against the real PHI export (build/export/Diogenes-
# Resources/xml/phi/phi1017015.xml): 126 <div type="letter">
# (n="t"|1..124|"fr"), each nesting <div type="section">
# (n="sa"|"t"|1..N). Letters 1-124 are contiguous, zero gaps/dups, zero
# within-letter section-numbering anomalies.
#
# §B salutation fold: every real letter's first section is
# <section n="sa"> (the "Seneca to his Lucilius, greetings" address),
# verified exactly one per letter across all 124. `citation.
# salutation_role: true` folds it as a leading role="salutation" line onto
# that letter's own section 1 (never its own citable column) -- see
# stage1_latin._parse_letters.
#
# §C title restore (citation.title_labels below): the pre-letter-1 shell
# <div type="letter" n="t"> (its own nested <section n="1"> is the Liber
# Primus heading, taken WHOLE at the letter level -- never via a naive
# "drop section n=t" rule, which would miss it entirely) plus 16 embedded
# <section n="t"> per-Liber headings inside real letters (verified at
# letters 13, 22, 30, 42, 53, 63, 70, 75, 81, 84, 89, 93, 96, 101, 110, 118).
# REVIEW-CHECKLIST item 5 (John's ruling, 2026-08-03): once hash-verified
# against a declared entry below, each of these 17 labels is RESTORED as a
# visible heading -- a leading role="heading" line on the letter it precedes
# (its own section 1), ahead of that letter's role="salutation" line --
# rather than discarded, exactly the fold pattern §B describes for the
# salutation itself (see stage1_latin.py's _parse_letters). Books XII, XIII
# and XVIII carry no heading div in the export at all (a genuine
# manuscript-transmission gap, not a pipeline drop) -- left silent, per the
# same ruling: no editorial note synthesized for the gap.
# DEVIATION FROM THE DESIGN NOTE: §C says "17 embedded headings" and
# "title_labels therefore declares 18 entries" (shell + 17). The real
# export carries exactly 17 <section n="t"> divs TOTAL in the whole
# document, but ONE of them sits inside the excluded `fr` appendix (§D)
# and is never descended into or hash-checked -- only 16 embedded headings
# live inside real letters 1-124. title_labels below therefore declares 17
# entries (1 shell + 16 embedded), not 18; verified directly against the
# real export (16 listed letters + 1 inside fr = 17 total, matching the
# note's own "plus one in fr" aside, which its own "18" count then
# double-counted).
#
# §D fr exclusion: <div type="letter" n="fr"> (10 sections, no
# salutation -- a Gellius-excerpts appendix, testimonia about the letters,
# not Seneca's own text) is excluded via `citation.exclude_letters`, never
# descended into (its own internal section n="t" heading is therefore
# never hash-checked -- see the deviation note above).
#
# English: Richard M. Gummere's Loeb translation (3 vols., 1918-1925/
# 1920/1925 -- Vol. I's own physically-inspected title-page verso reads
# "First Printed 1918. Reprinted 1925."; see sources/gummere-epistulae/
# README.md for the per-volume printing history), extracted from
# Wikisource's mainspace transcription via
# pipeline/tools/extract_gummere_wikisource.py. Complete
# coverage (2139/2140) -- one declared gap, see `alignment_allow_unmatched`
# below and that script's own module docstring for the cross-checked
# edition-numbering explanation (Letter 108's Latin section 39 has no
# separately-numbered English counterpart).

work:
  id: epistulae-morales
  title: "Epistulae Morales ad Lucilium"
  author: "seneca"
  language: "lat"
  lexicon: true
  phi_author: "1017"
  phi_work: "015"
  latin_edition: "Reynolds, L. D. (ed.), L. Annaei Senecae ad Lucilium Epistulae Morales, 2 vols. (Oxford Classical Texts, 1965)"
  # FATAL sourceDesc gate (De Officiis/De Providentia precedent): verified
  # verbatim against the real PHI export (build/export/Diogenes-Resources/
  # xml/phi/phi1017015.xml), whitespace-collapsed the same way
  # stage1_greek._check_sourcedesc normalizes it (re.sub(r"\s+", " ", ...))
  # -- the raw export text carries a double space before "(1017: 015)".
  expected_sourcedesc: 'L. Annaeus Seneca iunior. Epistulae Morales ad Lucilium (L. Annaei Senecae ad Lucilium Epistulae Morales. Vols. 1 2, ed. L. D. Reynolds, 1965). (1017: 015)'

citation:
  scheme: letter
  hideLineNumbers: true
  # §B: fold each real letter's <section n="sa"> onto its own section 1
  # as a leading role="salutation" line.
  salutation_role: true
  # §D: the post-124 Gellius-excerpts appendix, excluded wholesale.
  exclude_letters: ["fr"]
  # No cross-LETTER hyphen wraps observed (same_book_required=True never
  # crosses a letter boundary anyway); 3 genuine cross-SECTION wraps found
  # within a letter, re-export drift tripwire.
  cross_section_rejoins: 3
  # §C: 1 letter-"t" shell + 16 embedded section-"t" per-Liber headings
  # -- see the DEVIATION note at the top of this file (17 entries, not the
  # design note's stated 18).
  title_labels:
    - { sha256_16: "9e8ac9266e2dd387", note: "pre-letter-1 shell heading (letter t) -- the work title + book-1 label" }
    - { sha256_16: "7e0ff911ac98bd92", note: "embedded per-Liber heading, letter 13 (section t)" }
    - { sha256_16: "dfc1bad50c4b07c1", note: "embedded per-Liber heading, letter 22 (section t)" }
    - { sha256_16: "b9d4d110c50dfa15", note: "embedded per-Liber heading, letter 30 (section t)" }
    - { sha256_16: "473e05e932619db9", note: "embedded per-Liber heading, letter 42 (section t)" }
    - { sha256_16: "3961b338ef4c56bd", note: "embedded per-Liber heading, letter 53 (section t)" }
    - { sha256_16: "d5481791932f97eb", note: "embedded per-Liber heading, letter 63 (section t)" }
    - { sha256_16: "61778c1a903fbd20", note: "embedded per-Liber heading, letter 70 (section t)" }
    - { sha256_16: "40e5801e89374f5c", note: "embedded per-Liber heading, letter 75 (section t)" }
    - { sha256_16: "0c08fcf29bc6af22", note: "embedded per-Liber heading, letter 81 (section t)" }
    - { sha256_16: "c6062c1176f0a0b9", note: "embedded per-Liber heading, letter 84 (section t)" }
    - { sha256_16: "d3feae90e0ccccda", note: "embedded per-Liber heading, letter 89 (section t)" }
    - { sha256_16: "cbeacd907aa0bf4b", note: "embedded per-Liber heading, letter 93 (section t)" }
    - { sha256_16: "a61c458930762745", note: "embedded per-Liber heading, letter 96 (section t)" }
    - { sha256_16: "65bdced38b1aff28", note: "embedded per-Liber heading, letter 101 (section t)" }
    - { sha256_16: "dca7600af69cac67", note: "embedded per-Liber heading, letter 110 (section t)" }
    - { sha256_16: "c89782c38ff2f811", note: "embedded per-Liber heading, letter 118 (section t)" }

