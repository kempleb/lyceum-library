# Heraclitus Fragments (DK 22 B) — pipeline manifest (dk scheme: one flat
# div[@type="Fragment"][@n] per citable fragment, no nested section div —
# see pipeline/reader_pipeline/scheme.py's `dk` entry for the verified TEI
# shape). `english` (below) wires in Burnet's EGP 3rd ed. translation via
# pipeline/tools/extract_burnet_wikisource.py + stage1_flat_english (see the
# `english` block's own comment for the key-set reconciliation and the
# B5/B31 concat-merge finding).

work:
  id: heraclitus-fragments
  title: "Fragments"
  author: "heraclitus"
  language: "grc"
  tlg_author: "0626"
  tlg_work: "002"
  greek_edition: "Diels, H. and Kranz, W. (eds.), Die Fragmente der Vorsokratiker, 6th ed., vol. 1 (Berlin: Weidmann, 1951–52), 22 B"
  # FATAL sourceDesc gate (Wave 1c Sol nit, backfilled onto this committed
  # work since verifying it was trivial): stage1's _check_sourcedesc
  # asserts this exact substring is present in the export XML's own
  # <teiHeader><sourceDesc> text -- verified verbatim against
  # build/export/.../tlg0626002.xml.
  expected_sourcedesc: 'Heraclitus Phil., Fragmenta (0626: 002) "Die Fragmente der Vorsokratiker, vol. 1'

citation:
  scheme: dk
  series: B
  # dk_witness.py's owner-verified apparatus split (stage7_emit wiring):
  # count of this work's columns whose apparatus actually splits into
  # 2+ witnesses, cross-checked bidirectionally at preflight against the
  # emitted dist's own `witnesses` keys -- catches an unreviewed new
  # split and a stale declaration alike.
  dk_witness_split_columns: 5
  # Quote-mark polarity fix (owner ruling 2026-08-05, "we fix it and
  # make damn sure every instance is correct"): the raw TLG export
  # frequently opens a Greek quotation with U+2019 instead of U+2018 --
  # stage1_greek._dk_normalize_quote_marks fixes every BALANCED
  # (even-count) column automatically; this is that fix's own declared
  # count, cross-checked bidirectionally at preflight against the
  # emitted dist's actual U+2018/U+2019 total.
  dk_quote_marks_rewritten: 12
  hideLineNumbers: true
  # Opt in to DK source-citation expansion (docs/citation-expansion-wiring-
  # design.md): stage1_citation_expansion re-extracts each column's apparatus
  # head(s) and resolves the explicit ones against sources/dk-citations/
  # citation-dictionary.json, emitting an `expandedCitation` list per segment.
  # PILOT work (phase 1: heads-only, direct lookups, no dash walk-back). A
  # work without this flag is byte-identical to before the mechanism existed.
  expand_citations: true
  # 17 of 145 fragments carry no <hi rend="letter-spacing"> at all — a
  # verified DK6/export characteristic, CANON-log-worthy (see the Wave 1b
  # implementation report): even genuine, famous fragments (B53 "war is
  # father of all") sometimes have nothing typographically marked, either
  # because a "— —" continuation entry's citation is implied from an
  # earlier div and the whole remainder IS the quotation with nothing to
  # contrast against, or because the attested word is absorbed into a
  # source's own paraphrase with no macroscopically quotable span. See
  # stage1_greek._parse_fragments' role-coverage doc comment.
  unmarked_columns:
    - B33
    - B52
    - B53
    - B54
    - B55
    - B60
    - B61
    - B68
    - B69
    - B72
    - B76
    - B82
    - B83
    - B126b
    - B136
    - B138
    - B139
  # Diels' own declared deletions: B84 (replaced by B84a/B84b) and B109 (a
  # duplicate of B108, deleted by Diels; TLG follows) — CANON-log-worthy
  # (Wave 1b design memo §2.4). A re-export that restores either column
  # fails the build immediately (stage1_greek._parse_fragments) rather than
  # silently accepting the drift.
  expected_gaps:
    - B84
    - B109
  # B4 (Albertus Magnus' medieval Latin paraphrase) is Heraclitus' only
  # ENTIRELY Latin fragment. B37 (Columella), B67a (Hisdosus Scholasticus),
  # and B130 (a Latin Gnomologium) are mixed divs whose citation apparatus
  # is also Latin, but whose specific role='text' (letter-spaced) span is
  # itself Latin too, not Greek — zero Greek tokens in role='text' content
  # by construction for all four, not an extraction failure. All ship
  # readable but unclickable until Wave 2 (Latin morphology/Lewis & Short)
  # — CANON-log-worthy (Wave 1b design memo §4.4).
  latin_fragments:
    - B4
    - B37
    - B67a
    - B130

  # Freeman Ancilla: every markup/Greek disagreement is declared here.
  kind_overrides:
    B4:
      kind: omit
      reason: >
        Latin-only fragment; no Greek text for Freeman’s English to face
    B33:
      kind: embedded
      note: >
        B6a precedent: the Heraclitean sentence survives in the unmarked continuation of the Greek source
    B37:
      kind: omit
      reason: >
        Latin-only fragment from Columella; no Greek text for Freeman’s English to face
    B38:
      kind: embedded
      note: >
        B6a precedent: the reported Greek phrase survives inside Diogenes’ sentence
    B52:
      kind: embedded
      note: >
        B6a precedent: the Heraclitean maxim survives in the unmarked continuation of the Greek source
    B53:
      kind: embedded
      note: >
        B6a precedent: the Heraclitean maxim survives in the unmarked continuation of the Greek source
    B54:
      kind: embedded
      note: >
        B6a precedent: the Heraclitean maxim survives in the unmarked continuation of the Greek source
    B55:
      kind: embedded
      note: >
        B6a precedent: the Heraclitean maxim survives in the unmarked continuation of the Greek source
    B60:
      kind: embedded
      note: >
        B6a precedent: the Heraclitean maxim survives in the unmarked continuation of the Greek source
    B61:
      kind: embedded
      note: >
        B6a precedent: the Heraclitean maxim survives in the unmarked continuation of the Greek source
    B68:
      kind: embedded
      note: >
        B6a precedent: the reported Heraclitean word survives inside Iamblichus’ sentence
    B69:
      kind: embedded
      note: >
        B6a precedent: the reported Heraclitean statement survives inside Iamblichus’ sentence
    B72:
      kind: embedded
      note: >
        B6a precedent: the Heraclitean statement survives in the unmarked continuation of the Greek source
    B76:
      kind: embedded
      note: >
        B6a precedent: the Heraclitean statement survives inside the later authors’ Greek
    B82:
      kind: embedded
      note: >
        B6a precedent: the attributed comparison survives inside Plato’s Greek
    B83:
      kind: embedded
      note: >
        B6a precedent: the attributed comparison survives inside Plato’s Greek
    B126b:
      kind: embedded
      note: >
        B6a precedent: the quoted Heraclitean sentence survives inside the anonymous commentary
    B130:
      kind: omit
      reason: >
        Latin-only fragment; no Greek text for Freeman’s English to face
    B136:
      kind: embedded
      note: >
        B6a precedent: the attributed Heraclitean sentence survives inside the scholiast’s Greek
    B138:
      kind: omit
      reason: >
        Freeman gives only an editorial description of the surviving late epigram, not a translation; the column is unmarked and carries no Heraclitean text-role
    B139:
      kind: omit
      reason: >
        Freeman gives only an editorial description of the surviving astrological text, not a translation; the column is unmarked and carries no Heraclitean text-role
