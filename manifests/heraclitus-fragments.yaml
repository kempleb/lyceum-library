# Burnet EGP 3rd ed. (1920, Wikisource) English, retained as the secondary
# translation — extracted by
# pipeline/tools/extract_burnet_wikisource.py, keyed directly by dk column
# token (Burnet's numbers ARE Diels numbers for Heraclitus). Reused via
# stage1_flat_english (the flat `section` scheme's builder): a dk work's
# column token equals the source's own key, exactly like a flat scheme's
# bare chapter number — no dedicated dk english builder needed.
#
# CRITICAL CROSS-CHECK (Wave 1b Heraclitus integration, 2026-07-16): the raw
# Wikisource tagging carries FOUR tags — DK5A/DK5B/DK31A/DK31B — with no
# corresponding B5a/B5b/B31a/B31b in this work's spine (they are NOT in the
# lettered-fragment catalogue above). Verified against the Greek spine:
# B5's sole role='text' block is the word-for-word concatenation of Burnet's
# DK5A+DK5B translations (Origen's two-part purification quotation); B31's
# TWO role='text' blocks (separated by Clement's own paraphrase, itself
# role='context') match DK31A and DK31B respectively, in that order
# (Clement's two-part fire/sea/earth transformation quotation). Diels' 6th
# edition (this work's TLG source) merged what an earlier edition — the one
# Wikisource's tagging and Burnet's own 3rd ed. follow — numbered as split
# sub-fragments. Resolution: extract_burnet_wikisource.py's
# `_CONCAT_MERGE_COLUMNS` concatenates each pair under the single DK6
# column (B5, B31) at extraction time, so burnet-heraclitus.clean.json ships
# 113 keys (115 tagged fragments minus the 4 split halves, plus the 2
# merged columns) with no B5a/B5b/B31a/B31b keys at all. CANON-log-worthy.
english:
  primary:
    id: freeman
    name: "Kathleen Freeman, Ancilla to the Pre-Socratic Philosophers (Blackwell, 1948)"
    model: freeman
    file: "freeman-ancilla/freeman-heraclitus.clean.json"
    license:
      status: public-domain-us
      rationale: "Kathleen Freeman's Ancilla to the Pre-Socratic Philosophers (1948) is treated as US public domain per John's 2026-07-23 ruling (CANON.md, Freeman Ancilla copyright ruling); covered by attribution.astro's site-wide translation public-domain notice."
    group_headers_file: "freeman-ancilla/freeman-heraclitus.group_headers.json"
  # John's ruling 2026-07-29: B38/B82 are Freeman's own wholly parenthetical
  # précis, each ALSO covered by a translated context-english source-passage
  # span for the same column -- suppressed outright rather than labeled
  # (stage1_freeman_english.py gate 5; the Greek renders alone beside the
  # source passage). B69/B83 are précis with no such coverage -- labeled a
  # summary instead (see EnglishChunk.summary).
  summary_suppressed: [B38, B82]
  summary_labels: [B69, B83]
  secondary:
    id: burnet
    name: "John Burnet, Early Greek Philosophy, 3rd ed. (A. & C. Black, 1920)"
    model: archive
    file: "burnet-egp/burnet-heraclitus.clean.json"
    license:
      status: public-domain-us
      rationale: "Asserted US public domain by attribution.astro's site-wide translation notice: every translation listed there is United States public domain."

# 32 spine columns Burnet's translation does not cover — read at the TOP
# level (validate_english_source's `alignment_allow_unmatched` key is read
# off the manifest root, not nested under `english:`), keyed by segment id
# ("<book>:<column>", dk being bookless book=1). Verified against his
# printed text (sources/burnet-egp/raw/earlygreekphilosOOOOburn_djvu.txt)
# and the Wikisource tagging, not merely absent from the clean.json key
# set. Three groups, all genuine edition gaps, none an extraction defect:
#   - B67a, B130: this work's own declared `latin_fragments` (above) —
#     Burnet translates only the Greek-sourced fragments.
#   - B68, B69, B82, B126b, B136, B138, B139: this work's own declared
#     `unmarked_columns` (above) — no role='text' span exists to translate.
#   - The remaining 23 (mostly B105 and up): single-word/short-phrase
#     fragments preserved by late Byzantine lexicographers, outside the
#     scope of Bywater's 1877 selection that Burnet's 3rd ed. (1920)
#     translates from — confirmed absent from Burnet's own printed text,
#     not merely untagged on Wikisource (spot-checked directly against
#     the raw OCR: no rendering of B3/B46/B56/B70/B71/B74/B81/B105/B112/
#     B115/B116/B122/B124/B125a/B126a/B127/B128/B131/B132/B133/B134/B135
#     /B137 exists anywhere in Ch. III). B56 is a special case: Burnet's
#     own cross-reference note "(56) Same as 45" (Bywater's OWN ordinal
#     56, pointing at his OWN ordinal 45) is a numbering coincidence, not
#     a translation of DK/B56 — DK's B56 ("children deceiving Homer about
#     lice") is a different fragment with no Burnet rendering anywhere in
#     the chapter (verified: no DK56 Wikisource tag exists, and no
#     rendering of the lice/Homer content appears in the raw text).
#     CANON-log-worthy: the design memo's own cross-ref example does not
#     survive as a real DK column in this delivery — see the Wave 1b
#     integration report.
