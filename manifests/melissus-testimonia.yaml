# Melissus of Samos Testimonia (DK 30 A) — pipeline manifest (dk scheme:
# one flat div[@type="Fragment"][@n] per citable testimonium). Greek-only
# work: the A-testimonia are ancient reports/paraphrases about Melissus,
# not his own words — `english` intentionally absent (Wave 1b design memo
# §1, §5.1's "Greek-only work mode"). No homonym risk: TLG1494 is the only
# "Melissus Phil." author, and its <sourceDesc> cites DK vol. 1, 6th edn.
# directly.
#
# VERSE CHECK: exported plain (no `-y`); a control `-y` export of the same
# author was run and diffed for the record — it mis-verse-broke every line
# (335 spurious <l> elements in this work alone), discarded. Zero
# structurally-marked verse; no embedded verse quotation found in content
# either (unlike Zeno A1's Timon aside).
#
# STRUCTURE: 21 raw divs — plain n="1".."4", then a NEW div_concat shape:
# n="5" (bare — carries ONLY the citation header "ARISTOT. q. f. de Melisso
# Xenophane Gorgia c. 1. 2 nach d. Ausg. von Diels...", no fragment content
# of its own) immediately followed by SEVEN continuation divs n="5,974a"
# through "5,977a" (Diels' *Doxographi Graeci* page/column locators:
# 974a/974b/975a/975b/976a/976b/977a) that carry the entire quoted text —
# verified content-continuous, one unbroken excerpt of the same
# pseudo-Aristotelian "De Melisso Xenophane Gorgia" cc. 1-2 treatise that
# produced Xenophanes' A28 div_concat case (that testimonium quotes MXG on
# Xenophanes; this one quotes MXG on Melissus — same source work, same
# export shape). Unlike Xenophanes A28, a plain "5" div DOES exist here, but
# it holds no content of its own to merge div_map's leading/trailing single
# extra div onto (div_map allows at most one merge per side per target —
# verified against stage1_greek.py's `merge_targets_by_position` check,
# which would hard-error on seven trailing entries for one target). The
# fix, confirmed against stage1_greek.py's div_concat handling (no rule
# requires a div_concat target to lack a plain div — only that the target
# not collide with a div_map target): declare div_concat with the bare "5"
# as ITS OWN first ordered member, so all eight divs concatenate into one
# A5 column in document order. CANON-log-worthy: div_concat's first
# documented case (Xenophanes A28) had no plain base div at all; this is
# the first case where the target's own plain-numbered div IS itself a
# concat member.
#
# n="1".."4", n="6".."13": ordinary columns, no gaps/compounds beyond A5.
# Then n="14": ordinary column. Total: A1-A14 (14 columns), exactly the
# task's stated DK range (test. 1-14).

work:
  id: melissus-testimonia
  title: "Testimonia"
  author: "melissus"
  language: "grc"
  tlg_author: "1494"
  tlg_work: "001"
  greek_edition: "Diels, H. and Kranz, W. (eds.), Die Fragmente der Vorsokratiker, 6th ed., vol. 1 (Berlin: Weidmann, 1951–52), 30 A"
  # FATAL sourceDesc gate (Wave 1c Sol nit): stage1's _check_sourcedesc
  # asserts this exact substring is present in the export XML's own
  # <teiHeader><sourceDesc> text -- verified verbatim against
  # build/export/.../tlg1494001.xml. Catches a wrong-author or
  # wrong-volume re-export (a stale TLG_DIR pointing at a different
  # numbered file) at the earliest possible point.
  expected_sourcedesc: 'Melissus Phil., Testimonia (1494: 001) "Die Fragmente der Vorsokratiker, vol. 1'

citation:
  scheme: dk
  series: A
  # dk_witness.py's owner-verified apparatus split (stage7_emit wiring):
  # count of this work's columns whose apparatus actually splits into
  # 2+ witnesses, cross-checked bidirectionally at preflight against the
  # emitted dist's own `witnesses` keys -- catches an unreviewed new
  # split and a stale declaration alike.
  dk_witness_split_columns: 2
  # Quote-mark polarity fix (owner ruling 2026-08-05, "we fix it and
  # make damn sure every instance is correct"): the raw TLG export
  # frequently opens a Greek quotation with U+2019 instead of U+2018 --
  # stage1_greek._dk_normalize_quote_marks fixes every BALANCED
  # (even-count) column automatically; this is that fix's own declared
  # count, cross-checked bidirectionally at preflight against the
  # emitted dist's actual U+2018/U+2019 total.
  dk_quote_marks_rewritten: 14
  hideLineNumbers: true
  # A5 (the div_concat-merged Ps.-Aristotle MXG excerpt) verified zero
  # letter-spacing across all eight parts — DK printing a continuous
  # ancient paraphrase/epitome of Melissus' doctrine (MXG cc.1-2's own
  # numbered points 1-15), not a verbatim quotation — same finding as
  # Xenophanes' A28. Only A14 (Palaephatus' aside naming Melissus among
  # writers he admires, with one letter-spaced tag phrase) carries any
  # <hi rend="letter-spacing"> in this work; the other 13 columns (A1-A13)
  # do not.
  unmarked_columns:
    - A1
    - A2
    - A3
    - A4
    - A5
    - A6
    - A7
    - A8
    - A9
    - A10
    - A11
    - A12
    - A13
  div_concat:
    A5:
      - "5"
      - "5,974a"
      - "5,974b"
      - "5,975a"
      - "5,975b"
      - "5,976a"
      - "5,976b"
      - "5,977a"

# Digest fingerprint of the observed dk column spine (14 columns: A1-A14,
# with the eight "5"/"5,97Xy" divs merged into one A5 via citation.div_concat)
# — stage2 recomputes and compares it.
section_spine: { count: 14, sha256: "777ec8299643b3c98e79c70d7c3e45729f95738e007d53b641932d9a677b4f18" }

# dk is bookless (a single declared book covers the whole spine, like the
# flat `section` scheme's Enchiridion).
books:
  - { n: 1, start: "A1", end: "A14" }

sources:
  tlg_dir_env: "TLG_DIR"
  tlg_dir_default: "../TLG Files/TLG"
  diogenes_server: "/Applications/Diogenes.app/Contents/server"
  diogenes_data: "/Applications/Diogenes.app/Contents/dependencies/data"

