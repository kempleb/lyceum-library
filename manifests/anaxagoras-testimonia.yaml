# Anaxagoras of Clazomenae Testimonia (DK 59 A) — pipeline manifest (dk
# scheme: one flat div[@type="Fragment"][@n] per citable testimonium).
# Greek-only work: the A-testimonia are ancient reports/paraphrases about
# Anaxagoras, not his own words — `english` intentionally absent (Wave 1b
# design memo §1, §5.1's "Greek-only work mode"). No homonym risk: TLG0713
# is the only "Anaxagoras Phil." author.
#
# FIRST DK VOL. 2 AUTHOR (Wave 1b batch, CANON-log-worthy): this work's own
# <sourceDesc> cites "Die Fragmente der Vorsokratiker, vol. 2, 6th edn., Ed.
# Diels, H., Kranz, W. Berlin: Weidmann, 1952, Repr. 1966" — vol. 2 (not
# vol. 1, as every prior Wave 1b author), same Kranz 6th-edition posture
# (1952 vs. vol. 1's 1951, both pre-1931... no — both POST-1930, both
# copyright-gated the same way as vol. 1 under the existing CANON "extend
# the Farquharson precedent" call; no new copyright judgment needed, same
# Kranz-strip/serve-never-redistribute posture applies unchanged). Flagged
# here per the task brief's request to note the vol. 2 transition.
#
# VERSE CHECK: exported plain (no `-y`); a control `-y` export of the same
# author was run and diffed for the record — it mis-verse-broke every line
# (1002 spurious <l> elements in this work alone), discarded. Zero
# structurally-marked verse. Extensive embedded ancient VERSE quotation
# exists in plain content, however — most notably a ~45-line excerpt of
# LUCRETIUS *De Rerum Natura* I.830-877 (on the homoeomeria doctrine) inside
# a Latin testimonium context block, plus shorter verse tags (Euripides,
# Hesiod, Timon-adjacent material via other testimonia). None of this
# carries <hi rend="letter-spacing"> — it is ancient AUTHORS' OWN verse
# discussing/reporting Anaxagoras, not Anaxagoras' own words (he wrote in
# prose — Peri Physeos, a prose treatise, per every ancient report) — so no
# verse-citation mechanism applies; it renders as ordinary (Latin) context
# prose/verse content like the rest of its host div, preserved via
# `keep-latin` in dk-context-lang.json.
#
# STRUCTURE: 124 raw divs, clean single-number/lettered @n throughout (NO
# compound/comma divs anywhere in this work — verified, unlike Melissus'
# A5) — n=1-26, [A27 MISSING], 28-117, plus eight lettered variants (4a,
# 20a, 20b, 20c, 34a, 86a, 98a, 101a). 117 (highest number) - 1 (the A27
# gap) + 8 (lettered) = 124, matching the raw div count exactly — confirms
# no merges are needed, only the one declared gap. A27: Diels' own
# numbering gap in this series (no div n="27" in the export; DK6 vol. 2's
# own A-testimonia numbering has no A27) — declared per the Heraclitus
# B84/B109 / Xenophanes A10 precedent, so a re-export that restores it is
# caught, not silently accepted.
#
# Task brief's stated range ("test. 1-117") matches the export's own
# numbering exactly (117 is the true top number, modulo the A27 gap and the
# eight lettered sub-entries).

work:
  id: anaxagoras-testimonia
  title: "Testimonia"
  author: "anaxagoras"
  language: "grc"
  tlg_author: "0713"
  tlg_work: "001"
  greek_edition: "Diels, H. and Kranz, W. (eds.), Die Fragmente der Vorsokratiker, 6th ed., vol. 2 (Berlin: Weidmann, 1952), 59 A"
  # FATAL sourceDesc gate (Wave 1c Sol nit): stage1's _check_sourcedesc
  # asserts this exact substring is present in the export XML's own
  # <teiHeader><sourceDesc> text -- verified verbatim against
  # build/export/.../tlg0713001.xml. Catches a wrong-author or
  # wrong-volume re-export (a stale TLG_DIR pointing at a different
  # numbered file) at the earliest possible point.
  expected_sourcedesc: 'Anaxagoras Phil., Testimonia (0713: 001) "Die Fragmente der Vorsokratiker, vol. 2'

citation:
  expand_citations: true  # DK source-citation expansion, rule E (John, 2026-09-24)
  scheme: dk
  series: A
  # dk_witness.py's owner-verified apparatus split (stage7_emit wiring):
  # count of this work's columns whose apparatus actually splits into
  # 2+ witnesses, cross-checked bidirectionally at preflight against the
  # emitted dist's own `witnesses` keys -- catches an unreviewed new
  # split and a stale declaration alike.
  dk_witness_split_columns: 26
  # Quote-mark polarity fix (owner ruling 2026-08-05, "we fix it and
  # make damn sure every instance is correct"): the raw TLG export
  # frequently opens a Greek quotation with U+2019 instead of U+2018 --
  # stage1_greek._dk_normalize_quote_marks fixes every BALANCED
  # (even-count) column automatically; this is that fix's own declared
  # count, cross-checked bidirectionally at preflight against the
  # emitted dist's actual U+2018/U+2019 total.
  dk_quote_marks_rewritten: 84
  # FAIL-CLOSED: this work's raw export carries an ODD
  # U+2018/U+2019 count in these column(s) -- cannot be paired,
  # left completely untouched by the fix above (see
  # stage1_greek._dk_normalize_quote_marks' module doc).
  dk_unbalanced_quote_columns:
    - A10
    - A30
  hideLineNumbers: true
  # 105 of 124 testimonia carry no <hi rend="letter-spacing"> at all
  # (verified per-div against the export). The 19 marked columns (A1, A2,
  # A19, A20a, A35, A38, A40, A41, A45, A46, A47, A48, A52, A60, A61, A73,
  # A84, A92, A117) carry short DK-highlighted technical phrases within
  # Aristotle/doxographical paraphrase (same "ancient report ABOUT
  # Anaxagoras, occasionally preserving a marked technical phrase" pattern
  # as every other Wave 1b A-series). The bulk of Anaxagoras' extensive
  # Latin doxography (Cicero x5, Seneca Nat.Qu. x4, Lucretius, Tertullian,
  # Irenaeus, Ammianus Marcellinus, Censorinus x2, Gellius, Valerius
  # Maximus, Vitruvius, Pliny, Ps.-Aristotle De Plantis) falls entirely
  # within this unmarked set — confirmed none of it carries letter-spacing.
  # latin_fragments: A117's sole letter-spaced (role='text') word is
  # "lechineon" -- a single garbled term inside the medieval Latin
  # retranslation of Ps.-Aristotle's *De Plantis* (Theophrastus + De
  # Plantis A1, quoted for Anaxagoras' plant-sensation doctrine), itself
  # only surviving via a corrupt Latin/Byzantine retransmission -- zero
  # Greek tokens by construction, same posture as Heraclitus's B4/B37/
  # B67a/B130 and Parmenides' B18.
  latin_fragments:
    - A117
  # U+10144 GREEK ACROPHONIC ATTIC FIFTY: verified glued directly onto
  # adjacent Attic acrophonic numeral letters (Δ/Γ/Ι) with no separating
  # space in two Marmor Parium chronological entries quoted verbatim in A4a
  # ("ἔτη Η𐅄ΔΔΓΙΙΙΙ" = 179) and A11 ("ἔτη 𐅄ΔΔΔΔ" = 90) — genuine ancient
  # acrophonic-numeral inscription content (dates given in the Parian
  # Marble's own numeral notation, not prose Greek). PRESERVED, not
  # stripped: an earlier draft of this manifest listed it under
  # `export_artifact_chars` (Zeno testimonia A28's diagram-arrow
  # precedent), but unlike that arrow, this character is genuine numeral
  # content the reader must display intact, not export noise. Fixed at the
  # tokenizer level instead (stage3_tokenize.py's `_is_greek_numeral`, which
  # already carries the Milesian alphabetic-numeral precedent, now also
  # recognizes the whole Unicode "Ancient Greek Numbers" block,
  # U+10140-U+1018F): a token containing this character and no ordinary
  # Greek letters outside the numeral-letter set is classified as a
  # non-lexical numeral (no `k` lookup key expected), while the character
  # itself stays in the displayed text.
  expected_gaps:
    - A27
