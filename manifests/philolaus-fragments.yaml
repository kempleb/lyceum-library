# Philolaus of Croton Fragments (DK 44 B) — pipeline manifest (dk scheme:
# one flat div[@type="Fragment"][@n] per citable fragment, plain <p> prose,
# no <l> lines). Freeman Ancilla phase 3 (docs/phase3-sourcing-queue.md):
# Freeman is the sole English translation; Burnet is openly skeptical of
# the fragments' authenticity and never block-translates one, so there is
# no secondary translation to retain.
#
# TITLE DIVS (3, stripped by `_DK_TITLE_N_RE`, never columns): "tit,1-16"
# (label "ΦΙΛΟΛΑΟΥ ΠΕΡΙ ΦΥΣΙΟΣ ΑΒΓ" — "Philolaus, On Nature, books A B C"),
# "tit,17-19" (label "ΒΑΚΧΑΙ" — "Bacchae", the title DK gives fr. 17-19's
# source work), "tit,22-23" (label "ΠΕΡΙ ΡΥΘΜΩΝ ΚΑΙ ΜΕΤΡΩΝ ΑΒΓ" — "On
# Rhythms and Measures, books A B C"). MECHANISM CHOSEN (title-div question
# resolved by direct content reading, per the task brief's pointer to the
# Democritus B0a precedent): all three are PURE section-title headers —
# each div's entire content is one `<label type="head">` line with no
# fragment text of its own (content-verified, not assumed) — exactly the
# Democritus/Heraclitus title-div shape (DK's own thematic subsection
# headers within the B-collection), NOT the Democritus B0a shape (an
# ordinary numbered/lettered column that happens to carry real quoted
# content, e.g. Democritus' B0a "Pythagoras" is a genuine one-line title
# fragment attributed a real DK letter-number and cited as such). Philolaus'
# three title divs carry no DK letter-number at all (their own @n is the
# bare "tit,N-M" range-label shape) and no citable content — stripped, not
# spined, following the plain title-div precedent, not the B0a one.
#
# SELF-CLOSING LETTER-SPACING MILESTONES (CANON-log-worthy, a real,
# previously-evidenced export quirk — see stage1_greek.py's
# `_dk_role_blocks` doc, "Heraclitus B32/B41/B43/B84a" precedent, NOT a new
# mechanism): B1 and B6 — the two most-cited genuine Philolaus fragments —
# each open their quotation with an EMPTY self-closing
# `<hi rend="letter-spacing"/>` immediately followed by the quoted Greek as
# the element's own tail text, rather than the ordinary wrapping
# `<hi rend="letter-spacing">quote</hi>` shape. The existing milestone
# mechanism (last letter-spacing-family element in its immediate parent ->
# role extends to the rest of the node) already handles this correctly with
# NO parser change: verified directly against the export that neither B1's
# nor B6's milestone has a later same-parent letter-spacing sibling, so both
# resolve to "extends to the end" (the correct reading — B1's ἁ φύσις...
# opening sentence and B6's whole περὶ δὲ φύσιος...ἐπόγδοα καὶ δίεσις. block
# are genuinely Philolaus' own words per every edition).
#
# VERSE CHECK: exported plain (no `-y`; confirmed 0 `<l>` elements). All
# prose, matching Philolaus' known Doric prose treatise style (no verse
# fragments attributed to him in DK).
#
# STRUCTURE: 27 raw divs = 3 title divs (stripped) + 24 citable columns:
# n="1".."16" (16), "17".."19" (3), "20"/"20a" (2), "21" (1), "22"/"23" (2).
# No gaps, no div_map/div_concat cases.
#
# LETTER-SPACING FINDING: 23 of 24 columns carry at least one
# <hi rend="letter-spacing"> span (scoped or self-closing-milestone, per
# above); only B18 (a one-line bare citation, "Philolaus, from the Bacchae",
# no quoted text at all) is fully unmarked — declared in `unmarked_columns`.
#
# LATIN: B22 (CLAUD. MAM. de statu animae II 3/7, on Philolaus' "Peri
# rhythmon kai metron") mixes marked Latin sentences (Mamertus quoting
# Philolaus in Latin translation, the original Greek lost) WITH a marked
# GREEK phrase (the work's own Greek title, περὶ ῥυθμῶν καὶ μέτρων, which
# Mamertus quotes in the original) — so B22 carries real Greek role='text'
# tokens and is NOT a `latin_fragments` case (that gate only fires when a
# column's ENTIRE role='text' content is Latin, e.g. Philolaus testimonia's
# A26). B6 similarly mixes a large genuinely-Greek marked block (via the
# self-closing milestone above) with a handful of Latin letter-spaced
# technical terms from Boethius' paraphrase (see philolaus-testimonia.yaml's
# A26 note for the parallel Boethius passage) — same non-issue, real Greek
# role='text' content already present.

work:
  id: philolaus-fragments
  title: "Fragments"
  author: "philolaus"
  language: "grc"
  tlg_author: "1596"
  tlg_work: "002"
  greek_edition: "Diels, H. and Kranz, W. (eds.), Die Fragmente der Vorsokratiker, 6th ed., vol. 1 (Berlin: Weidmann, 1951–52), 44 B"
  # FATAL sourceDesc gate: stage1's _check_sourcedesc asserts this exact
  # substring is present in the export XML's own <teiHeader><sourceDesc>
  # text -- verified verbatim against build/export/.../tlg1596002.xml.
  expected_sourcedesc: 'Philolaus Phil., Fragmenta (1596: 002) "Die Fragmente der Vorsokratiker, vol. 1'

citation:
  expand_citations: true  # DK source-citation expansion, rule E (John, 2026-09-24)
  scheme: dk
  series: B
  # dk_witness.py's owner-verified apparatus split (stage7_emit wiring):
  # count of this work's columns whose apparatus actually splits into
  # 2+ witnesses, cross-checked bidirectionally at preflight against the
  # emitted dist's own `witnesses` keys -- catches an unreviewed new
  # split and a stale declaration alike.
  dk_witness_split_columns: 3
  # Quote-mark polarity fix (owner ruling 2026-08-05, "we fix it and
  # make damn sure every instance is correct"): the raw TLG export
  # frequently opens a Greek quotation with U+2019 instead of U+2018 --
  # stage1_greek._dk_normalize_quote_marks fixes every BALANCED
  # (even-count) column automatically; this is that fix's own declared
  # count, cross-checked bidirectionally at preflight against the
  # emitted dist's actual U+2018/U+2019 total.
  dk_quote_marks_rewritten: 14
  hideLineNumbers: true
  unmarked_columns:
    - B18
  # Freeman Ancilla phase 3: B15 and B19 are wholly-italic parenthetical
  # entries whose column nonetheless carries a live Greek role='text' line
  # -- resolved `embedded` under the Protagoras B6a precedent (words
  # survive embedded in the source's own narration). B18 is the one
  # declared unmarked column: Stobaeus reports that the quotation itself
  # has fallen out, so no Greek survives to support any English -- `omit`
  # under John's 2026-07-23 ruling.
  kind_overrides:
    B15:
      kind: embedded
      note: >
        column carries a role='text' line even though wholly parenthetical
        in Freeman's own presentation; Protagoras B6a precedent -- words
        survive embedded in the source's own narration
    B18:
      kind: omit
      reason: >
        declared unmarked_columns -- Stobaeus reports the quotation itself
        has fallen out; no Greek survives for this column
  fragment_kinds:
    B1: verbatim
    B2: verbatim
    B3: verbatim
    B4: verbatim
    B5: verbatim
    B6: verbatim
    B7: verbatim
    B8: verbatim
    B9: verbatim
    B10: verbatim
    B11: verbatim
    B12: verbatim
    B13: verbatim
    B14: verbatim
    B15: embedded
    B16: verbatim
    B17: embedded
    B18: omit
    B19: embedded
    B20: verbatim
    B20a: verbatim
    B21: verbatim
    B22: embedded
    B23: embedded

# Freeman's fifth-edition numbering matches the corresponding DK6 tokens
# exactly; no remap needed.
freeman_concordance: {}

# Freeman's three structural labels, declared and hash-gated as paratext.
group_headers:
  - before_column: B17
    level: 2
    text: "Attributed to a prose work called 'Bacchae'"
    sha256_16: "fc44bcb14fd93d44"
  - before_column: B20
    level: 2
    text: "Doubtful fragments"
    sha256_16: "475a6be829bb5d7f"
  - before_column: B21
    level: 2
    text: "Spurious fragments"
    sha256_16: "67a8bd47a6bef5ba"

# Digest fingerprint of the observed dk column spine (24 columns, B1-B16,
# B17-B19, B20/B20a, B21, B22/B23, no gaps) — stage2 recomputes and
# compares it.
section_spine: { count: 24, sha256: "5db0b88dc7ca03f331c0a3458be8b732a980e1f619ebb001349b04023b9a438d" }

# dk is bookless (a single declared book covers the whole spine, like the
# flat `section` scheme's Enchiridion).
books:
  - { n: 1, start: "B1", end: "B23" }

english:
  primary:
    id: freeman
    name: "Kathleen Freeman, Ancilla to the Pre-Socratic Philosophers (Blackwell, 1948)"
    model: freeman
    file: "freeman-ancilla/freeman-philolaus.clean.json"
    license:
      status: public-domain-us
      rationale: "Kathleen Freeman's Ancilla to the Pre-Socratic Philosophers (1948) is treated as US public domain per John's 2026-07-23 ruling (CANON.md, Freeman Ancilla copyright ruling); covered by attribution.astro's site-wide translation public-domain notice."
    group_headers_file: "freeman-ancilla/freeman-philolaus.group_headers.json"
  # John's ruling 2026-07-29: B15/B19 are Freeman's own wholly parenthetical
  # précis of a reporting source, with no translated context-english span
  # covering the same material -- labeled a summary rather than suppressed
  # (stage1_freeman_english.py gate 5; see EnglishChunk.summary).
  summary_labels: [B15, B19]

sources:
  tlg_dir_env: "TLG_DIR"
  tlg_dir_default: "../TLG Files/TLG"
  diogenes_server: "/Applications/Diogenes.app/Contents/server"
  diogenes_data: "/Applications/Diogenes.app/Contents/dependencies/data"

