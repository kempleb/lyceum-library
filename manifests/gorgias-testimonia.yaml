# Gorgias of Leontini Testimonia (DK 82 A) — pipeline manifest (dk scheme:
# one flat div[@type="Fragment"][@n] per citable testimonium, plain <p>
# prose, no <l> lines). Greek-only work: ancient reports/paraphrases about
# Gorgias, not his own words; no free English translation exists (Burnet
# never covers the Sophists).
#
# TLG0593 IS THE SOPHIST (task-directed, verified): confirmed directly
# against the export's own <sourceDesc>, 'Gorgias Rhet., Soph., Testimonia
# (0593: 002) "Die Fragmente der Vorsokratiker, vol. 2, 6th edn.", ...' --
# NOT TLG2255 (Gorgias the historian, a different person, untouched by this
# wave; no manifest references it).
#
# NON-DK WORK EXCLUDED (task-directed): TLG0593 carries a THIRD work, 001
# Testimonium (FGrH) — no Diels-Kranz number, excluded, never
# export-referenced by any manifest.
#
# VERSE CHECK: exported plain (no `-y`); confirmed 0 <l> elements anywhere in
# the export. Straight biographical/doxographical prose (PHILOSTR. V. S.,
# SUID., DIOG. Laert., PLATO dialogues, ARISTOT., XENOPH., CIC., QUINTIL.,
# PLIN., etc.), including substantial unmarked Latin narrative (A11-A14, A26,
# A30-A32) and one marked all-Latin span (A32).
#
# STRUCTURE: 40 divs, n="1".."35" (35, consecutive, no gaps) plus five
# lettered variants (1a, 2a, 5a, 8a, 15a), each an independently-existing
# div (not a merge of a base "N" div — every lettered @n and its bare-number
# counterpart are separate divs). No title divs, no div_map/div_concat/
# compound_n_map cases.
#
# LETTER-SPACING FINDING: only 4 of 40 columns carry any
# <hi rend="letter-spacing"> span (A1, A21, A27, A32) — Gorgias' testimonia
# are overwhelmingly pure doxography/biography/anecdote with almost nothing
# quoted verbatim, the same pattern already seen in the Milesian/Pythagorean
# testimonia-primary authors. The other 36 columns are declared
# `unmarked_columns` below, content-verified per column (not assumed).
#
# LATIN: A32 (Cicero, Orator, on Thrasymachus/Gorgias' rhetorical figures)
# carries exactly one marked role='text' span, a single Latin noun (Cicero's
# own word for the rhetorical "witticisms/pleasantries" he attributes to
# Gorgias) — zero Greek tokens for this fragment, a genuine `latin_fragments`
# case (same posture as Heraclitus B4/Protagoras B6). A11-A14/A26/A30-A31 carry
# substantial unmarked Latin narrative (QUINT., CIC., PLIN.) but none of it
# is letter-spaced — plain context, no `latin_fragments` declaration needed
# for those (that gate only fires on a MARKED column whose entire role='text'
# content is Latin).

work:
  id: gorgias-testimonia
  title: "Testimonia"
  author: "gorgias"
  language: "grc"
  tlg_author: "0593"
  tlg_work: "002"
  greek_edition: "Diels, H. and Kranz, W. (eds.), Die Fragmente der Vorsokratiker, 6th ed., vol. 2 (Berlin: Weidmann, 1952), 82 A"
  # FATAL sourceDesc gate: stage1's _check_sourcedesc asserts this exact
  # substring is present in the export XML's own <teiHeader><sourceDesc>
  # text -- verified verbatim against build/export/.../tlg0593002.xml.
  expected_sourcedesc: 'Gorgias Rhet., Soph., Testimonia (0593: 002) "Die Fragmente der Vorsokratiker, vol. 2'

citation:
  expand_citations: true  # DK source-citation expansion, rule E (John, 2026-09-24)
  scheme: dk
  series: A
  # dk_witness.py's owner-verified apparatus split (stage7_emit wiring):
  # count of this work's columns whose apparatus actually splits into
  # 2+ witnesses, cross-checked bidirectionally at preflight against the
  # emitted dist's own `witnesses` keys -- catches an unreviewed new
  # split and a stale declaration alike.
  dk_witness_split_columns: 5
  # Quote-mark polarity fix (owner ruling 2026-08-05, "we fix it and
  # make damn sure every instance is correct"): the raw TLG export
  # frequently opens a Greek quotation with U+2019 instead of U+2018 --
  # stage1_greek._dk_normalize_quote_marks fixes every BALANCED
  # (even-count) column automatically; this is that fix's own declared
  # count, cross-checked bidirectionally at preflight against the
  # emitted dist's actual U+2018/U+2019 total.
  dk_quote_marks_rewritten: 24
  # FAIL-CLOSED: this work's raw export carries an ODD
  # U+2018/U+2019 count in these column(s) -- cannot be paired,
  # left completely untouched by the fix above (see
  # stage1_greek._dk_normalize_quote_marks' module doc).
  dk_unbalanced_quote_columns:
    - A11
    - A20
  hideLineNumbers: true
  unmarked_columns:
    - A1a
    - A2
    - A2a
    - A3
    - A4
    - A5
    - A5a
    - A6
    - A7
    - A8
    - A8a
    - A9
