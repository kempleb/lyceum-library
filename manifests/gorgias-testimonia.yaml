    - A11
    - A12
    - A13
    - A14
    - A15
    - A15a
    - A16
    - A17
    - A18
    - A19
    - A20
    - A22
    - A23
    - A24
    - A25
    - A26
    - A28
    - A29
    - A30
    - A31
    - A33
    - A34
    - A35
  latin_fragments:
    - A32

# Digest fingerprint of the observed dk column spine (40 columns, A1-A35
# plus A1a/A2a/A5a/A8a/A15a, no gaps) — stage2 recomputes and compares it.
section_spine: { count: 40, sha256: "8cd0e8a83f130113a93f7083b58886c278330a4b42cf9fbf5072c3fc55668b65" }

# dk is bookless (a single declared book covers the whole spine, like the
# flat `section` scheme's Enchiridion).
books:
  - { n: 1, start: "A1", end: "A35" }

sources:
