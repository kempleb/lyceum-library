registry:
  id: lives
  title: Lives of Eminent Philosophers
  greekTitle: Βίοι καὶ γνῶμαι τῶν ἐν φιλοσοφίᾳ εὐδοκιμησάντων
  abbr: D.L.
  author: diogenes-laertius
  language: grc
  workType: continuous
  books: 10
  bookLabels:
    - I
    - II
    - III
    - IV
    - V
    - VI
    - VII
    - VIII
    - IX
    - X
  greekEdition: 'Long, H. S. (ed.), Diogenis Laertii Vitae philosophorum, 2 vols. (Oxford: Clarendon Press, 1964, repr. 1966)'
  greekSource:
    short: Long (1964)
    full: 'Long, H. S. (ed.), Diogenis Laertii Vitae philosophorum, 2 vols. (Oxford: Clarendon Press, 1964, repr. 1966)'
  translations:
    - id: hicks
      name: R. D. Hicks (Loeb Classical Library, 1925)
      short: Hicks
      slot: english
    - id: yonge
      name: C. D. Yonge (1853; Bell & Sons, 1915)
      short: Yonge
      slot: secondary
  citation:
    scheme: book-section
    hideLineNumbers: true
    # Block-per-section source layout — see WorkMeta["citation"].linedGreek.
    # RULED OFF (John, 2026-08-31): "reflow prose, keep the verse". The lined
    # display exists to stop GUTTER apparatus colliding with the wrong print
    # line (the 2026-08-28 Discourses report linedGreek was added for). Lives
    # has no gutter apparatus — 13,853 lines, not one `sec` or `paraN` — so
    # its print lines aligned nothing, while forcing one rendered line per
    # print line made 94% of them CSS-wrap at 375px into stranded single
    # words. Prose now reflows to the reader's width.
    #
    # `linedSource` deliberately STAYS true: the print channel still carries
    # the `indent` levels that mark Long's 2,259 verse lines (epigrams and
    # poetic quotations), which keep rendering as real, inset lines via
    # Reader.svelte's `isVerseLine`. Every wave-2 TEXT correction is in the
    # data, not the display, and is untouched either way.
    linedGreek: false
    linedSource: true
    copyAbbr: D.L.
  blurb: Ten books of biography and doxography surveying the whole of Greek philosophy, from the Seven Sages to Epicurus.
