# Lives of Eminent Philosophers — pipeline manifest (book-section scheme:
# Diogenes Laertius is cited by book.section, "7.85", same convention as
# Marcus Aurelius' Meditations, but the TLG export nests div[@type="section"]
# directly under div[@type="Book"] (no intermediate "chapter" wrapper) — the
# citation.div_types.section override below tells stage1_greek to treat
# "section" as the citable unit instead of book-section's registered default
# "chapter". Philosopher-heading stub divs (@n="tSTART-END") are collected
# separately as philosopher_headers, not citable columns — see
# stage1_greek._parse_flat_book_section. Collection is gated on this
# manifest's `philosophers:` block below (any book-section work WITHOUT one
# hard-fails on a t-prefixed @n instead of silently losing it).

work:
  id: lives
  title: "Lives of Eminent Philosophers"
  author: "diogenes-laertius"
  language: "grc"
  tlg_author: "0004"
  tlg_work: "001"
  greek_edition: "Long, H. S. (ed.), Diogenis Laertii Vitae philosophorum, 2 vols. (Oxford: Clarendon Press, 1964, repr. 1966)"
  # FATAL sourceDesc gate (Wave 1c Sol nit, backfilled onto this committed
  # work since verifying it was trivial): stage1's _check_sourcedesc
  # asserts this exact substring is present in the export XML's own
  # <teiHeader><sourceDesc> text -- verified verbatim against
  # build/export/.../tlg0004001.xml.
  expected_sourcedesc: 'Diogenes Laertius Biogr. (c. A.D. 3), Vitae philosophorum (0004: 001) "Diogenis Laertii vitae philosophorum'
  # Rights status of the SERVED Greek text (John's licence-string ruling,
  # 2026-09-22, distinct from the Hicks/Yonge English above and from
  # Perseus's own CC BY-SA 4.0 TEI/EpiDoc markup and apparatus, which stays
  # disclosed separately on app/src/pages/attribution.astro and is never
  # folded into this status).
  source_license:
    status: unverified
    rationale: "Greek text exported from TLG follows H. S. Long's Oxford Classical Text (1964). Whether the served text inherits any public-domain status is an open ruling (John and Brian); the Hicks translation's public-domain status is separate and recorded on the translation."

citation:
  scheme: book-section
  hideLineNumbers: true
  lined_source: true
  lined_cross_column_wraps: 61
  lined_indent_max: 16
  div_types:
    section: "section"
  # Diogenes Laertius Book 10 (Epicurus) carries a well-known manuscript leaf
  # transposition in the doxographical epitome just before the Letter to
  # Menoeceus: the TLG export's own <div type="section"> run for what every
  # translation reads as plain sections 120-121 is actually FOUR lettered
  # fragments in manuscript document order — n="120a", "121b", "120b",
  # "121a" — not two plain-numbered divs (confirmed: this is the ONLY place
  # in the whole corpus these letter-suffixed section @n values appear).
  # R. D. Hicks's 1925 Loeb (following Bignone's transposition, noted in his
  # own footnote right at the seam) reads this exact document-order run as
  # 120a + 121b + 120b concatenated = his section 120, then 121a alone = his
  # section 121 — content-verified against the Hicks Perseus XML
  # (sources/hicks-dl/tlg0004.tlg001.perseus-eng2.xml, ~lines 5382-5389):
  # Hicks Sec 120 opens "He will leave written words..." (=120a's own opening
  # "συγγράμματα καταλείψειν"), continues "The wise man will set up votive
  # images..." right after Hicks's own footnote "The transposition of this
  # paragraph is due to Bignone" (=121b's "Εἰκόνας ... ἀναθήσειν"), continues
  # "The school holds that sins are not all equal..." (=120b's "ἁμαρτήματα
  # ... ἄνισα εἶναι"); Hicks Sec 121 opens "Two sorts of happiness..."
  # (=121a's "Τὴν εὐδαιμονίαν διχῆ νοεῖσθαι") and ends at the Letter to
  # Menoeceus's salutation, matching 121a's own close.
  #
  # stage1_greek._resolve_lettered_fragments applies this remap ONLY because
  # it is declared here, and only after verifying the export's encountered
  # lettered-n set for book 10 matches `found` EXACTLY (same members, same
  # document order) — a mismatch (missing/extra/reordered), or any lettered
  # @n turning up in a book with no declaration, fails loudly at parse time
  # rather than silently misparsing or drifting until stage2's spine-digest
  # check (Sol Major 1 review round, 2026-07-16).
  lettered_fragments:
    - book: 10
      found: ["120a", "121b", "120b", "121a"]
      merge:
        "120": ["120a", "121b", "120b"]
        "121": ["121a"]

english:
  primary:
    id: hicks
    name: "R. D. Hicks (Loeb Classical Library, 1925)"
    model: archive
    file: "hicks-dl/hicks-lives.clean.json"
    license:
      status: public-domain-us
      rationale: "Asserted US public domain by attribution.astro's site-wide translation notice: every translation listed there is United States public domain."
    verse_sidecar: "hicks-dl/hicks-verse.json"
  secondary:
    id: yonge
    name: "C. D. Yonge (1853; Bell & Sons, 1915)"
    model: archive
    file: "yonge-dl/yonge-lives.clean.json"
    license:
      status: public-domain-us
      rationale: "Asserted US public domain by attribution.astro's site-wide translation notice: every translation listed there is United States public domain."

philosophers:
  names_file: "hicks-dl/lives-names.json"

# Digest fingerprint of the observed book.section column spine (1,204
# columns, 1.1..10.154) — stage2 recomputes and compares it. Includes the
# two synthetic merged columns 10.120/10.121 (see this file's
# citation.lettered_fragments above: the TLG export's own div @n values for
# this span are the manuscript-order lettered fragments 120a/121b/120b/121a,
# not plain 120/121 — merged onto Hicks's own resolved section numbers,
# content-verified against the Hicks Perseus XML at that seam).
section_spine: { count: 1204, sha256: "0c89b260bae924ed96ce35249f3ff4cf4065e993d2736864e9f93325c4862fcc" }

# Hicks (primary) matches the Greek spine's 1,204 columns exactly — no
# alignment_allow_unmatched entries needed (see the reconciliation ledger in
# sources/INVENTORY.md and this manifest's own commit note).

# Yonge (secondary) is keyed at Life level (80 chunks, one per philosopher,
# each keyed at that philosopher's Hicks/Greek chapter-start column — see
# extract_yonge_dl_gutenberg.py's docstring for why per-section keying was
# measured and rejected). Every spine column that is not one of those 80
# Life-start keys is therefore a genuine, structural secondary-translation
# gap, generated deterministically by pipeline/tools/gen_lives_yonge_allowance.py
# (re-run: `uv run python tools/gen_lives_yonge_allowance.py` from pipeline/,
# after `reader_pipeline stage1 --work lives` has produced
# build/stage1/greek_spine.json) — 1,124 entries, spine (1,204) minus Yonge
# keys (80).
alignment_allow_unmatched_secondary:
