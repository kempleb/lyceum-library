# Critias Fragments (DK 88 B) — pipeline manifest (dk scheme, VERSE variant:
# `citation.lines: true`, PLUS a new `citation.prose_columns` mechanism --
# see below). Freeman Ancilla phase 3 (docs/phase3-sourcing-queue.md):
# Freeman is the sole English translation.
#
# Confirmed directly against the export's own <sourceDesc>: 'Critias Eleg.,
# Phil., Trag., Fragmenta (0319: 004) "Die Fragmente der Vorsokratiker,
# vol. 2, 6th edn.", ...'. Excluded non-DK works: see
# critias-testimonia.yaml's header note (001/002 poetic corpora, 005
# Pirithous papyri).
#
# ★ MIXED VERSE+PROSE FINDING (task-flagged risk, "declare honestly"):
# Diogenes' own is_work_verse heuristic already classifies this whole work
# "Fragmenta (lines)" WITHOUT forcing -y (plain and -y invocations are
# byte-identical for this file -- verified) -- correct for its genuinely
# metrical content (elegies B1-B29 area, the tragedies Rhadamanthys/
# Pirithous/Sisyphus, B75's elegiac line), but the heuristic decides
# verse/prose at WHOLE-WORK granularity, not per-div: EVERY div in the
# export holds raw <l n> lines, including a substantial LATER run of
# columns (B31 on) that are, by direct reading, genuinely PROSE
# testimonia -- Critias' own prose Constitution of the Spartans (B32-B39,
# whose section-title div lacks the "in verse" qualifier that B6-B9's own
# Constitutions-in-verse title carries), his prose Homilies (B40-B41a), a
# prose philosophical fragment (B42), and a long run of Pollux/
# biographical/lexicographic testimonia quoting Critias' prose vocabulary
# one word/phrase at a time (B44-B73). Direct evidence: these columns' raw
# <l> lines wrap ordinary prose words mid-print-line with a literal
# trailing hyphen (28 columns carry at least one such wrap, every declared
# prose column read in full) -- the SAME hallmark (docs/tlg-phi-export.md)
# that already distinguishes forced prose-chopping from real verse
# elsewhere in this corpus; real verse line-ends never split a word.
#
# Routing these columns through the ordinary verse-citation path would be
# a genuine citation-scheme error, not merely cosmetic: `_dk_walk_verse_div`
# assigns each role='text' line a synthetic 1-based `cite_n` ("B32.1",
# "B32.2", ...) as if citing a poem's own line numbers -- DK never cites
# these prose fragments by line. New mechanism, `citation.prose_columns`
# (stage1_greek.py, same module): declares specific columns of a verse work
# whose raw <l> lines are read via the identical mechanical per-line
# `_dk_role_blocks` walk (ambient state threaded across lines, proven
# reliable for prose testimonia throughout this whole corpus) but then
# ASSEMBLED via `_dk_merge_blocks` exactly like an ordinary <p>-based prose
# column -- adjacent same-role lines collapse into flowing paragraphs,
# `cite_n` is always None. See the tool's own module comment for the full
# mechanism and its mutual-exclusion contract with `verse_text_lines`.
# CANON-log-worthy: a new declaration kind, first needed by this work.
#
# VERSE ROLE DETERMINATION (direct reading of every verse column, per the
# task's CANON rule -- bulk heuristics prohibited): the mechanical
# `<hi>`-based walk (ambient milestone state threaded across <l> lines,
# `_dk_role_blocks`) gets the FULL EXTENT of the real verse right in every
# case checked (self-closing milestones correctly persist role='text'
# across an entire multi-line quotation) -- but several columns' apparatus
# ALSO contains a truncated preview quotation ("...") of the SAME verse
# quoted in full later, using the same letter-spacing convention, which the
# mechanical walk (correctly, given its own contract) also marks role=text
# -- producing a literal duplicate of the real quotation. Every exclusion
# below is backed by OBJECTIVE evidence: either (a) the excluded span is a
# byte-for-byte duplicate of the real quotation's own opening/closing words
# (several carry Diels' own explicit bracketed line-reference, e.g. B25's
# "[1. 2]"/"[17. 18.]"/"[33. 34.]", confirming exactly which real lines the
# preview duplicates), (b) the excluded span carries an embedded scholarly
# citation bracket (e.g. B16 line 19's "[TGF p. 547, Eur. fr. 591 N2.]",
# a stage-direction-like editorial bridge, never spoken verse), or (c) the
# excluded span is an unambiguous full apparatus sentence (attribution +
# further clauses, not a short attribution tag). Per the Xenophanes/
# Parmenides precedent, a SHORT (<=5-word) bare attribution tag immediately
# preceding the real quotation (B6 line 3's "in the Elegies" tag, B6 line
# 25's "and next he says" bridge, B8 line 2's "in the Elegies he prays"
# tag -- given here in translation only)
# is ACCEPTED as the SAME documented minor imprecision (whole-line
# granularity), not overridden. Every column below is a philologically-
# reviewed, evidence-based declaration; verified against the well-known
# published texts these fragments correspond to (Anacreon encomium B1,
# kottabos elegy B2, the Spartan symposium elegy B6, the Sisyphus fragment
# B25) for line count and content match.
#
# STRUCTURE: 80 divs = 7 title divs (stripped, all bare Greek section
# headers, given here in translation only: "tit,2-3" Critias' Elegies,
# "tit,4-5" To Alcibiades, "tit,6-9" Constitutions in Verse / Constitution
# of the Spartans, "tit,13-15" Rhadamanthys, "tit,16-23" Pirithous,
# "tit,32-37" Constitution of the Spartans [the prose one], "tit,40-41a"
# Homilies books A/B) plus 73 ordinary
# citable columns: B1-B75 with THREE numeric gaps (B11, B24, B74 -- no div
# of any kind, absent from the export entirely) and lettered B41a (plus
# B12's own div carries an embedded Tennes title and B25's a Sisyphus-the-
# satyr-play title as an inline <l n="tit"> line, and B39's an inline
# Aphorisms-books-A/B header -- all correctly fall
# through to the mechanical default as ordinary context, no manifest
# action needed).
#
# TWO GENUINE TITLE-ONLY COLUMNS (content-verified, NOT title-div-stripped
# -- same shape as Hippias B5/Gorgias B9): B30, the bare title of a
# conjectured lost Constitution of the Athenians (Diels' own conjecture,
# angle-bracketed in the export itself), and B43, the bare title of the
# Public-Speech Prologues -- each a single bare-title line, no apparatus,
# no letter-spacing. Declared `unmarked_columns`. B3 (a Latin doxographic
# testimonium with zero letter-spacing, reporting Critias' claim that
# Orpheus invented the dactylic hexameter) is genuinely context-only too --
# also declared `unmarked_columns` (not `prose_columns`: it has no text
# block either way, so which mechanical path processes it makes no
# difference).
work:
  id: critias-fragments
  title: "Fragments"
  author: "critias"
  language: "grc"
  tlg_author: "0319"
  tlg_work: "004"
  greek_edition: "Diels, H. and Kranz, W. (eds.), Die Fragmente der Vorsokratiker, 6th ed., vol. 2 (Berlin: Weidmann, 1952), 88 B"
  # FATAL sourceDesc gate: stage1's _check_sourcedesc asserts this exact
  # substring is present in the export XML's own <teiHeader><sourceDesc>
  # text -- verified verbatim against build/export/.../tlg0319004.xml.
  expected_sourcedesc: 'Critias Eleg., Phil., Trag., Fragmenta (0319: 004) "Die Fragmente der Vorsokratiker, vol. 2'

citation:
  scheme: dk
  series: B
  # dk_witness.py's owner-verified apparatus split (stage7_emit wiring):
  # count of this work's columns whose apparatus actually splits into
  # 2+ witnesses, cross-checked bidirectionally at preflight against the
  # emitted dist's own `witnesses` keys -- catches an unreviewed new
  # split and a stale declaration alike.
  dk_witness_split_columns: 4
  # Quote-mark polarity fix (owner ruling 2026-08-05, "we fix it and
  # make damn sure every instance is correct"): the raw TLG export
  # frequently opens a Greek quotation with U+2019 instead of U+2018 --
  # stage1_greek._dk_normalize_quote_marks fixes every BALANCED
  # (even-count) column automatically; this is that fix's own declared
  # count, cross-checked bidirectionally at preflight against the
  # emitted dist's actual U+2018/U+2019 total.
  dk_quote_marks_rewritten: 40
  # FAIL-CLOSED: this work's raw export carries an ODD
  # U+2018/U+2019 count in these column(s) -- cannot be paired,
  # left completely untouched by the fix above (see
  # stage1_greek._dk_normalize_quote_marks' module doc).
  dk_unbalanced_quote_columns:
    - B19
