      label: 'The A-testimonia: ancient reports about Prodicus'
  blurb: Prodicus’ own words and Xenophon’s close paraphrase of his Heracles allegory — the choice between Virtue and Vice at the crossroads, the treatise On Nature, and the hair-splitting distinctions between near-synonyms (wish vs. desire, joy vs. pleasure) that made him famous and faintly ridiculous to his rivals.
