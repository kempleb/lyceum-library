# Epicurus, Letter to Menoeceus (Ep. Men.) — pipeline manifest. TLG
# 0537:012, Arrighetti edition. Flat, bookless `section` scheme (Epictetus'
# Enchiridion precedent, manifests/enchiridion.yaml); TLG's own div type is
# "Section" (capitalized) — citation.div_types.page overrides the scheme's
# registered default "Chapter" (see manifests/epicurus-letter-to-herodotus.yaml
# for the same override).
#
# NON-1-START: this letter's numbering runs 122-135 (Diogenes Laertius'
# running Book X section count, continuing past the intervening
# biographical material at 117-121) — verified against the export. Same
# non-issue as the other two letters.
#
# TITLE/GREETING DIV: same shape as Ep. Herodotum — a top-level
# <div type="Section" n="t"> carrying the letter's own opening salutation
# ("Ἐπίκουρος Μενοικεῖ χαίρειν."). Declared as `title_labels` (dropped,
# same as a bare collection title — see
# manifests/epicurus-letter-to-herodotus.yaml's matching comment for why:
# every printed edition treats this as an unnumbered rubric above section
# 122, not part of its cited text) and
# stage1_greek.py's `_load_flat_title_declarations` for the mechanism.

work:
  id: epicurus-letter-to-menoeceus
  title: "Letter to Menoeceus"
  author: "epicurus"
  language: "grc"
  tlg_author: "0537"
  tlg_work: "012"
  greek_edition: "Arrighetti, G. (ed.), Epicuro: Opere, 2nd ed. (Turin: Einaudi, 1973)"
  # FATAL sourceDesc gate: verified verbatim against the real export
  # (build/phi-test/out-epicurus/Diogenes-Resources/xml/tlg/tlg0537012.xml).
  expected_sourcedesc: 'Epicurus Phil. (c. 4-3 B.C.), Epistula ad Menoeceum (0537: 012) "Epicuro. Opere, 2nd edn.", Ed. Arrighetti, G. Turin: Einaudi, 1973.'

citation:
  scheme: section
  hideLineNumbers: true
  # John's ruling (2026-08-29, docs/lined-rollout-plan.md Ruling 1/wave 1):
  # the Greek column renders Arrighetti's own print lines, hyphenated
  # line-end splits included, extending Discourses' treatment
  # (docs/lined-source-plan.md) to the flat `section` scheme. Gates
  # stage1_greek's per-<l> emission (`_lined_chapter_lines` +
  # `_apply_lined_wraps`) inside `_parse_flat_chapter`. No
  # `lined_section_div`: this work's column div (Section) IS the leaf — no
  # sub-column granularity exists to record, so no line carries `sec`
  # (Ruling 1c).
  lined_source: true
  lined_indent_max: 2
  div_types:
    page: "Section"
  title_labels:
    - sha256_16: "a265be9ececbf2b5"
      note: >
        "Ἐπίκουρος Μενοικεῖ χαίρειν." (Epicurus to Menoeceus, greetings) —
        the letter's own opening salutation, exported as its own div
        immediately before section 122; dropped as an unnumbered rubric.

# English: R. D. Hicks (1925), same shared store as the other two Letters —
# see manifests/epicurus-letter-to-herodotus.yaml's matching comment for the
# store/key_prefix mechanism.
#
# BOUNDARY MATTER (verified, not trimmed): 10.135 — this letter's own last
# DL section — ends with Diogenes' own resumptive summary sentence
# following directly after the letter's actual last sentence, all inside
# this one section's Hicks text (see build_hicks_epicurus_letters.py's
# module docstring for the exact trailing string and the verification).
# Kept verbatim, same rationale as Ep. Hdt.'s matching note.
english:
  primary:
    id: hicks
    name: "R. D. Hicks (Loeb Classical Library, 1925)"
    model: archive
    file: "hicks-dl/hicks-epicurus-letters.clean.json"
    license:
      status: public-domain-us
      rationale: "Asserted US public domain by attribution.astro's site-wide translation notice: every translation listed there is United States public domain."
    key_prefix: "letter-to-menoeceus:"

# Digest fingerprint of the observed bare-section column spine (14 columns,
# "122".."135") — stage2 recomputes and compares it. Computed directly
# against the real export.
section_spine: { count: 14, sha256: "432105c6733686a0a2faef97d9a1c6556337514d86dd1f066c62bb6372b04173" }

books:
  - { n: 1, start: "122", end: "135" }

sources:
  tlg_dir_env: "TLG_DIR"
  tlg_dir_default: "../TLG Files/TLG"
  diogenes_server: "/Applications/Diogenes.app/Contents/server"
  diogenes_data: "/Applications/Diogenes.app/Contents/dependencies/data"

registry:
  id: epicurus-letter-to-menoeceus
  slug: letter-to-menoeceus
  title: Letter to Menoeceus
  abbr: Ep. Men.
  author: epicurus
  language: grc
  workType: letters
  books: 1
  bookLabels:
    - '1'
  greekEdition: 'Arrighetti, G. (ed.), Epicuro: Opere, 2nd ed. (Turin: Einaudi, 1973)'
  greekSource:
    short: Arrighetti (1973)
    full: 'Arrighetti, G. (ed.), Epicuro: Opere, 2nd ed. (Turin: Einaudi, 1973)'
  translations:
    - id: hicks
      name: R. D. Hicks (Loeb Classical Library, 1925)
      short: Hicks
      slot: english
  citation:
    scheme: section
    hideLineNumbers: true
    copyAbbr: Ep. Men.
    unitNoun:
      singular: section
      plural: sections
    # RULED (John, 2026-08-31, on Letter to Menoeceus): "if this is not
    # cited by line numbers, then this needs prose reflow." These works are
    # cited by chapter/section, never by line, so their print lines serve no
    # citation and align no gutter apparatus (measured: 0 gutter cells), yet
    # forced 91% of Menoeceus' lines to wrap into stubs at 375px. Prose now
    # reflows; `linedSource` stays true so quoted verse keeps real lines.
    proseReflow: true
    # Reader-side flag mirroring pipeline citation.lined_source 1:1
    # (2026-08-29, docs/lined-rollout-plan.md Stage 1/3) — see
    # WorkMeta['citation'].linedSource in shared/lib/works.ts.
    linedSource: true
  related:
    - id: lives
      label: 'Diogenes Laertius, Book X: the same letter transcribed within his Life of Epicurus'
    - id: epicurus-kuriai-doxai
      label: 'Kuriai Doxai: the ethical maxims that expand this letter''s teaching on pleasure and the fear of death'
  blurb: Epicurus' letter on ethics — pleasure as the goal, prudent reasoning about desires, and the argument that death, "the most frightening of evils," is nothing to us, since where we are, death is not, and where death is, we are not.
