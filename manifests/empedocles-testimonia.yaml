# Empedocles Testimonia (DK 31 A) — pipeline manifest (dk scheme: one flat
# div[@type="Fragment"][@n] per citable testimonium, plain <p> prose, no <l>
# lines — like Heraclitus/Parmenides/Xenophanes testimonia). Greek-only
# work: the A-testimonia are ancient reports/paraphrases about Empedocles,
# not his own words, and no free English translation of them exists —
# `english` is intentionally absent (Wave 1b design memo §1, §5.1's
# "Greek-only work mode").
#
# EXPORT (Wave 1b Empedocles, fourth dk author, the scale test — ~3.5x
# Heraclitus per the memo's §3 note): TLG1342 carries only THREE works in
# this corpus copy — 002 Epigramma (AG 9.569, a single epigram, NOT a DK
# work — the anecdotal epitaph tradition, not Diels/Kranz's B/A numbering),
# 003 Testimonia (this work), 004 Fragmenta (empedocles-fragments.yaml).
# The groundwork's X01/X02 (Epigramma irrisorium, Sphaera [Sp.] ed. Maass)
# do NOT exist in this TLG corpus copy at all — verified against the
# author's own <authtab> entry (only 002/003/004 listed) and the raw
# TLG1342.IDT index (same three work names, no fourth/fifth). 002 is
# excluded here with the same appendix-deferral posture as the groundwork
# anticipated for X01/X02 (Wave 1b memo §8.2, §8.4 — non-DK appendix works
# out of scope). This work (003) was exported PLAIN (no `-y`) — correct for
# prose testimonia, per docs/tlg-phi-export.md's two-invocation rule.
#
# STRUCTURE: 100 divs — Fragment n=1-9, 11-98 (n=10 a clean gap — DK's own
# numbering has no A10 in this series, mirrors Xenophanes' A10/Heraclitus'
# precedent), plus THREE lettered columns (20a, 43a, 69a). No title div (no
# div[@n^="tit"] at all — testimonia never carries one; only Fragmenta
# does). No div_map/div_concat irregularities (no compound-n divs at all in
# this work, unlike Fragmenta's "77,78"/"148,149,150" — see that manifest).
work:
  id: empedocles-testimonia
  title: "Testimonia"
  author: "empedocles"
  language: "grc"
  tlg_author: "1342"
  tlg_work: "003"
  greek_edition: "Diels, H. and Kranz, W. (eds.), Die Fragmente der Vorsokratiker, 6th ed., vol. 1 (Berlin: Weidmann, 1951–52), 31 A"
  # FATAL sourceDesc gate (Wave 1c Sol nit, backfilled onto this committed
  # work since verifying it was trivial): stage1's _check_sourcedesc
  # asserts this exact substring is present in the export XML's own
  # <teiHeader><sourceDesc> text -- verified verbatim against
  # build/export/.../tlg1342003.xml.
  expected_sourcedesc: 'Empedocles Poet. Phil., Testimonia (1342: 003) "Die Fragmente der Vorsokratiker, vol. 1'

citation:
  expand_citations: true  # DK source-citation expansion, rule E (John, 2026-09-24)
  scheme: dk
  series: A
  # dk_witness.py's owner-verified apparatus split (stage7_emit wiring):
  # count of this work's columns whose apparatus actually splits into
  # 2+ witnesses, cross-checked bidirectionally at preflight against the
  # emitted dist's own `witnesses` keys -- catches an unreviewed new
  # split and a stale declaration alike.
  dk_witness_split_columns: 20
  # Quote-mark polarity fix (owner ruling 2026-08-05, "we fix it and
  # make damn sure every instance is correct"): the raw TLG export
  # frequently opens a Greek quotation with U+2019 instead of U+2018 --
  # stage1_greek._dk_normalize_quote_marks fixes every BALANCED
  # (even-count) column automatically; this is that fix's own declared
  # count, cross-checked bidirectionally at preflight against the
  # emitted dist's actual U+2018/U+2019 total.
  dk_quote_marks_rewritten: 78
  hideLineNumbers: true
  # 89 of 100 testimonia carry no <hi rend="letter-spacing"> at all —
  # verified against the export (prose role-block extraction is
  # run-granular, not line-granular like the verse Fragmenta, so no
  # override mechanism is needed here at all: a div either carries
  # letter-spacing, an ordinary column, or it doesn't, declared below).
  # A slightly higher unmarked share than Heraclitus (19/27), Parmenides
  # (51/59), and Xenophanes (45/52) A-testimonia — consistent with the
  # established pattern that the A-series is ancient doxography/biography
  # ABOUT the philosopher, and DK's typography only distinguishes a
  # directly-quoted phrase from the surrounding report when one survives.
  unmarked_columns:
    - A2
    - A3
    - A5
    - A6
