# Xenophanes Testimonia (DK 21 A) — pipeline manifest (dk scheme: one flat
# div[@type="Fragment"][@n] per citable testimonium, plain <p> prose, no <l>
# lines -- like Heraclitus/Parmenides testimonia). Greek-only work: the
# A-testimonia are ancient reports/paraphrases about Xenophanes, not his own
# words, and no free English translation of them exists -- `english` is
# intentionally absent (Wave 1b design memo §1, §5.1's "Greek-only work
# mode").
#
# EXPORT (Wave 1b Xenophanes, third dk author): TLG0267 carries SIX works;
# only two are DK6 (Diels/Kranz 1951/52) -- 0267:005 (this work, Testimonia)
# and 0267:006 (Fragmenta). The other four are explicitly OUT of Wave 1b's
# scope, verified from each file's own <sourceDesc>: 0267:001 "Iambi et
# elegi Graeci, vol. 2" ed. West 1972 (post-1930, non-DK), 0267:002
# "Anthologia lyrica Graeca" ed. Diehl 1949 (post-1930, non-DK), 0267:003
# Epigramma (Anthologia Graeca 7.120, not a DK work at all), 0267:004
# Testimonium (Jacoby's FGrH 450, not a DK work at all) -- same deferral
# posture as Empedocles' non-DK appendix works (Wave 1b memo §8.4). This
# work (005) was exported PLAIN (no `-y`) -- correct for prose testimonia,
# per docs/tlg-phi-export.md's two-invocation rule (verified: zero <l>
# elements in this export; the `-y` invocation of the SAME author
# mis-verse-broke it into 467 spurious <l> lines, discarded).
#
# STRUCTURE: 56 divs -- Fragment n=1-9, 11-27 (n=10 a clean gap), FIVE divs
# n="28,977a"/"28,977b"/"28,978a"/"28,978b"/"28,979a", n=29-40, 41/41a,
# 42-52. The five "28,*" divs are NOT a div_map case (Parmenides' shape:
# an EXTRA div merged around a real, independently-existing target column)
# -- there is NO plain "28" div at all. DK's own testimonium A28 (a long
# continuous quotation of Ps.-Aristotle's "De Melisso Xenophane Gorgia" cc.
# 3-4) is split across FIVE export divs at the quoted treatise's own
# Bekker-page boundaries (Bekker 977a-979a of the Aristotelian corpus) --
# genuinely one column with no div of its own. New mechanism
# `citation.div_concat` (Wave 1b Xenophanes finding, not anticipated by the
# design memo or the Parmenides precedent): an ORDERED list of source divs
# that TOGETHER compose a column, verified content-continuous (read as one
# unbroken Ps.-Aristotle passage across all five parts) — see
# stage1_greek._parse_fragments's div_concat handling. CANON-log-worthy.

work:
  id: xenophanes-testimonia
  title: "Testimonia"
  author: "xenophanes"
  language: "grc"
  tlg_author: "0267"
  tlg_work: "005"
  greek_edition: "Diels, H. and Kranz, W. (eds.), Die Fragmente der Vorsokratiker, 6th ed., vol. 1 (Berlin: Weidmann, 1951–52), 21 A"
  # FATAL sourceDesc gate (Wave 1c Sol nit, backfilled onto this committed
  # work since verifying it was trivial): stage1's _check_sourcedesc
  # asserts this exact substring is present in the export XML's own
  # <teiHeader><sourceDesc> text -- verified verbatim against
  # build/export/.../tlg0267005.xml.
  expected_sourcedesc: 'Xenophanes Poet. Phil., Testimonia (0267: 005) "Die Fragmente der Vorsokratiker, vol. 1'

citation:
  scheme: dk
  series: A
  # dk_witness.py's owner-verified apparatus split (stage7_emit wiring):
  # count of this work's columns whose apparatus actually splits into
  # 2+ witnesses, cross-checked bidirectionally at preflight against the
  # emitted dist's own `witnesses` keys -- catches an unreviewed new
  # split and a stale declaration alike.
  dk_witness_split_columns: 2
  # Quote-mark polarity fix (owner ruling 2026-08-05, "we fix it and
  # make damn sure every instance is correct"): the raw TLG export
  # frequently opens a Greek quotation with U+2019 instead of U+2018 --
  # stage1_greek._dk_normalize_quote_marks fixes every BALANCED
  # (even-count) column automatically; this is that fix's own declared
  # count, cross-checked bidirectionally at preflight against the
  # emitted dist's actual U+2018/U+2019 total.
  dk_quote_marks_rewritten: 52
  # FAIL-CLOSED: this work's raw export carries an ODD
  # U+2018/U+2019 count in these column(s) -- cannot be paired,
  # left completely untouched by the fix above (see
  # stage1_greek._dk_normalize_quote_marks' module doc).
  dk_unbalanced_quote_columns:
    - A47
  hideLineNumbers: true
  # No <hi rend="letter-spacing"> at all: prose role-block extraction
  # (_dk_role_blocks/_dk_merge_blocks) is run-granular, not line-granular
  # like the verse Fragmenta -- a short marked phrase inside a long
  # narrative div is correctly isolated as its own role='text' block with
  # NO contamination, so (unlike Fragmenta) no override mechanism is needed
  # here at all: a div either carries letter-spacing (an ordinary column)
  # or it doesn't (declared below). 45 of 52 columns carry no
  # letter-spacing at all -- an even larger share than Heraclitus (19/27)
  # and slightly more than Parmenides (51/59) -- the A-series is ancient
  # doxography/biography ABOUT Xenophanes, and DK's typography only
  # distinguishes a directly-quoted phrase from the surrounding report when
  # one survives at all (memo §2.4/§4.2). A28 (the div_concat-merged
  # Ps.-Aristotle MXG quotation) is included here too: verified zero
  # letter-spacing across all five of its parts -- it is DK printing a
  # continuous ancient paraphrase of Xenophanes' theology, not a verbatim
  # quotation.
  unmarked_columns:
    - A1
    - A2
    - A3
    - A4
    - A5
    - A6
    - A7
    - A8
    - A9
    - A11
    - A12
    - A13
    - A14
    - A15
    - A16
    - A17
    - A18
    - A19
    - A20
    - A21
    - A22
    - A23
    - A25
    - A26
    - A27
    - A28
    - A30
    - A32
    - A34
    - A35
    - A37
    - A38
    - A39
    - A40
    - A41
    - A41a
    - A42
    - A43
    - A44
    - A45
    - A48
    - A49
    - A50
    - A51
    - A52
  div_concat:
    A28:
      - "28,977a"
      - "28,977b"
      - "28,978a"
      - "28,978b"
      - "28,979a"
  # A10: Diels' own numbering gap in this series (no div n="10" in the
  # export; DK6 vol. 1's own A-testimonia numbering has no A10 -- see the
  # Wave 1b Xenophanes report). Declared so a re-export that RESTORES a
  # div DK previously omitted is caught, not silently accepted (mirrors
  # Heraclitus B84/B109).
  expected_gaps:
    - A10

# Digest fingerprint of the observed dk column spine (52 columns: A1-A52
# minus the A10 gap, plus the lettered A41a, with the five "28,*" divs
# merged into one A28 via citation.div_concat) -- stage2 recomputes and
# compares it.
section_spine: { count: 52, sha256: "fea00f51ca474da98ffd403c75797411c9e86677155d7a904f9a3a9018a22bee" }

# dk is bookless (a single declared book covers the whole spine, like the
# flat `section` scheme's Enchiridion).
books:
  - { n: 1, start: "A1", end: "A52" }

sources:
