# Hippias of Elis Fragments (DK 86 B) — pipeline manifest (dk scheme: one
# flat div[@type="Fragment"][@n] per citable fragment, plain <p> prose, no
# <l> lines). Freeman Ancilla phase 3 (docs/phase3-sourcing-queue.md):
# Freeman is the sole English translation; Burnet never covers the
# Sophists.
#
# EXTRACTION FIX (B16 page-break split): sacred-texts prints B16's entry
# across a page break ("...one wrong, when one envies the good." / p. 144 /
# "Envious people have double sufferings: ... good fortune)."), the second
# half a wholly-italic paragraph with no leading number, no small caps, and
# no roman prose -- the extractor's own L2-group-header signature. The
# module's roman-continuation check only covers a roman-prose continuation,
# not this wholly-italic-across-a-page-break shape, so it misclassified the
# second half as a bare paratext label. Content-verified against the fixture
# (`pipeline/tests/fixtures/freeman/app81.htm` lines 33-37) and corrected by
# hand in `freeman-hippias.clean.json`: the two halves are one continuous
# B16 sentence, merged; the bogus header entry is dropped from
# `freeman-hippias.group_headers.json` rather than declared.
#
# Confirmed directly against the export's own <sourceDesc>: 'Hippias Soph.,
# Fragmenta (1434: 004) "Die Fragmente der Vorsokratiker, vol. 2, 6th
# edn.", ...'.
#
# TITLE-ONLY COLUMN (a REAL DK numbering quirk, content-verified, NOT
# stripped): B5 carries nothing but the bare Greek title of the lost
# Trojan Dialogue (with DK's own parenthesized genre word) — no citation
# apparatus, no quoted content, no letter-spacing. Cross-referenced
# independently by Hippias-testimonia A2's own bracketed "[B 5]" apparatus
# (Philostratus' report that Hippias also wrote it). The same shape as
# Protagoras B8a-h / Gorgias B9 (see those manifests) — declared
# `unmarked_columns`, not title-stripped (no `_DK_TITLE_N_RE` match: its
# @n is the plain numeral "5", not "tit,...").
#
# ONE GENUINE GAP: B7 is absent from the export entirely (no div n="7" of
# any kind, not even a title/empty stub) — the numeric sequence jumps 6->8.
# Declared `expected_gaps` below (same posture as Gorgias B28) — DK's own
# reason for the gap is not independently verified here, but the export
# evidence (div genuinely absent) is unambiguous.
#
# VERSE CHECK: exported plain (no `-y`); confirmed 0 <l> elements anywhere
# in the export (see hippias-testimonia.yaml's header note on the
# two-invocation comparison for this author).
#
# STRUCTURE: 20 divs = 20 citable columns (no title divs at all in this
# work): B1-B6 (6), B8-B21 (14, B7 absent — see gap above). No
# div_map/div_concat/compound_n_map cases.
#
# LETTER-SPACING FINDING: 8 of 20 columns carry at least one
# <hi rend="letter-spacing"> span (B2, B3, B4, B6, B9, B10, B12, B17). 12
# are fully unmarked — declared below: B1, B5 (title-only), B8, B11, B13,
# B14, B15, B16, B18, B19, B20, B21.
#
# LATIN: none found — every marked role='text' span in this work is Greek.
#
# DAMAGE DOTS: none found.
work:
  id: hippias-fragments
  title: "Fragments"
  author: "hippias"
  language: "grc"
  tlg_author: "1434"
  tlg_work: "004"
  greek_edition: "Diels, H. and Kranz, W. (eds.), Die Fragmente der Vorsokratiker, 6th ed., vol. 2 (Berlin: Weidmann, 1952), 86 B"
  # FATAL sourceDesc gate: stage1's _check_sourcedesc asserts this exact
  # substring is present in the export XML's own <teiHeader><sourceDesc>
  # text -- verified verbatim against build/export/.../tlg1434004.xml.
  expected_sourcedesc: 'Hippias Soph., Fragmenta (1434: 004) "Die Fragmente der Vorsokratiker, vol. 2'

citation:
  expand_citations: true  # DK source-citation expansion, rule E (John, 2026-09-24)
  scheme: dk
  series: B
  # dk_witness.py's owner-verified apparatus split (stage7_emit wiring):
  # count of this work's columns whose apparatus actually splits into
  # 2+ witnesses, cross-checked bidirectionally at preflight against the
  # emitted dist's own `witnesses` keys -- catches an unreviewed new
  # split and a stale declaration alike.
  dk_witness_split_columns: 2
  # Quote-mark polarity fix (owner ruling 2026-08-05, "we fix it and
  # make damn sure every instance is correct"): the raw TLG export
  # frequently opens a Greek quotation with U+2019 instead of U+2018 --
  # stage1_greek._dk_normalize_quote_marks fixes every BALANCED
  # (even-count) column automatically; this is that fix's own declared
  # count, cross-checked bidirectionally at preflight against the
  # emitted dist's actual U+2018/U+2019 total.
  dk_quote_marks_rewritten: 16
  hideLineNumbers: true
  unmarked_columns:
    - B1
    - B5
    - B8
    - B11
    - B13
    - B14
    - B15
    - B16
    - B18
    - B19
    - B20
    - B21
  expected_gaps:
    - B7
  # Freeman Ancilla phase 3 conflicts (docs/phase3-sourcing-queue.md). B5
  # is the declared unmarked title-only column (bare Greek title of the
  # lost Trojan Dialogue) -- same shape as Protagoras B8a-h / Gorgias B9,
  # ships `title`. B2, B3, B4, B9, B10, B12, B17 each keep a role='text'
  # survival despite wholly-parenthetical presentation, resolved
  # `embedded` under the Protagoras B6a precedent. Every other conflicted
  # column (B1, B8, B11, B13, B14, B15, B16, B18, B19, B20, B21) is an
  # ordinary unmarked testimonium with no Hippias Greek at all -- `omit`
  # under John's 2026-07-23 ruling. Freeman's own B7 entry (Thales'
  # animism anecdote) is an English-only orphan matching the declared
  # `expected_gaps` hole in the DK spine -- dropped, not fabricated.
  kind_overrides:
    B1:
      kind: omit
      reason: >
        unmarked column, Pausanias testimonium, no Hippias Greek survives
    B2:
      kind: embedded
      note: >
        column carries a role='text' line even though wholly
        parenthetical; Protagoras B6a precedent
    B3:
      kind: embedded
      note: >
        column carries a role='text' line even though wholly
        parenthetical; Protagoras B6a precedent
    B4:
      kind: embedded
      note: >
        column carries a role='text' line even though wholly
        parenthetical; Protagoras B6a precedent
    B5:
      kind: title
      note: >
        declared unmarked_columns title-only column (bare Greek title of
        the lost Trojan Dialogue, no letter-spacing) -- same shape as
        Protagoras B8a-h / Gorgias B9
    B8:
      kind: omit
      reason: >
        unmarked column, doxographic report, no Hippias Greek survives
    B9:
      kind: embedded
      note: >
        column carries a role='text' line even though wholly
        parenthetical; Protagoras B6a precedent
    B10:
      kind: embedded
      note: >
        column carries a role='text' line even though wholly
        parenthetical; Protagoras B6a precedent
    B11:
      kind: omit
      reason: >
        unmarked column, testimonium about Lycurgus, no Hippias Greek
        survives
    B12:
      kind: embedded
      note: >
        column carries a role='text' line even though wholly
        parenthetical; Protagoras B6a precedent
    B13:
      kind: omit
      reason: >
        unmarked column, doxographic report, no Hippias Greek survives
    B14:
      kind: omit
      reason: >
        unmarked column, doxographic report, no Hippias Greek survives
    B15:
      kind: omit
      reason: >
        unmarked column, doxographic report, no Hippias Greek survives
    B16:
      kind: omit
      reason: >
        unmarked column, doxographic report, no Hippias Greek survives
    B17:
      kind: embedded
      note: >
        column carries a role='text' line even though wholly
        parenthetical; Protagoras B6a precedent
    B18:
      kind: omit
      reason: >
        unmarked column, doxographic report, no Hippias Greek survives
    B19:
      kind: omit
      reason: >
        unmarked column, papyrus testimonium (bare name only), no
        Hippias Greek survives
    B20:
      kind: omit
      reason: >
        unmarked column, Aristotle Poetics testimonium, no Hippias Greek
        survives
    B21:
      kind: omit
      reason: >
        unmarked column, Proclus testimonium, no Hippias Greek survives
  fragment_kinds:
    B1: omit
    B2: embedded
    B3: embedded
    B4: embedded
    B5: title
    B6: verbatim
    B8: omit
    B9: embedded
    B10: embedded
    B11: omit
    B12: embedded
    B13: omit
    B14: omit
    B15: omit
    B16: omit
    B17: embedded
    B18: omit
    B19: omit
    B20: omit
    B21: omit

# Freeman's fifth-edition numbering matches the corresponding DK6 tokens
# exactly; no remap needed.
freeman_concordance: {}

# Freeman's two structural labels, declared and hash-gated as paratext (the
# extraction-fix note above explains why only two, not three, are declared).
group_headers:
  - before_column: B6
    level: 2
    text: "From unspecified writings"
    sha256_16: "b26dd3deda0f43c9"
  - before_column: B20
    level: 2
    text: "Doubtful"
    sha256_16: "05c26131184a526d"

# Digest fingerprint of the observed dk column spine (20 columns: B1-B6,
# B8-B21; one declared gap B7) — stage2 recomputes and compares it.
section_spine: { count: 20, sha256: "ecde82b9f12c1640f4cc24003bdd2097868b8091ce691603742f14256cf9d707" }

# dk is bookless (a single declared book covers the whole spine, like the
# flat `section` scheme's Enchiridion).
books:
  - { n: 1, start: "B1", end: "B21" }

