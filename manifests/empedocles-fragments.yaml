# Empedocles Fragments (DK 31 B) — pipeline manifest (dk scheme, VERSE
# variant: `citation.lines: true`). Export shape verified against a
# TWO-INVOCATION export (docs/tlg-phi-export.md's per-invocation gotcha):
# tlg1342004.xml (this work) came from the `-y` (verse) invocation —
# hexameter `<l n>` lines DIRECTLY under each fragment div, the count
# restarting at 1 per fragment. tlg1342003.xml (Testimonia,
# manifests/empedocles-testimonia.yaml) came from the PLAIN invocation
# instead. Both invocations exported author 1342 (all three of its works
# in this corpus copy); only 003/004 are DK6 — 002 Epigramma (AG 9.569) is
# excluded (see the testimonia manifest's comment; the groundwork's
# X01/X02 do not exist in this TLG corpus copy at all).
#
# STRUCTURE (fourth dk author, the scale test — ~3.5x Heraclitus per the
# Wave 1b memo's §3 note): 163 divs total — TWO title divs (n="tit,1-111"
# for the Physika book, greek title label "ΕΜΠΕΔΟΚΛΕΟΥΣ ΠΕΡΙ ΦΥΣΕΩΣ ΑΒ";
# n="tit,112-153a" for the Katharmoi, label "ΚΑΘΑΡΜΟΙ" — both stripped,
# matching `_DK_TITLE_N_RE` unchanged; the Physika/Katharmoi boundary sits
# exactly at fr. 111/112, confirming the design memo's book-division
# hypothesis) plus 161 ordinary citable columns: frr. 1-159 (no numeric
# gaps in the plain sequence), the lettered 27a/109a/153a/154a/154c (154b
# is a genuine gap — DK's own lettered run has no 154b in this series),
# and TWO compound-n divs handled via the new `citation.compound_n_map`
# mechanism below (n="77,78" -> B77; n="148,149,150" -> B148).
#
# NEW citation.compound_n_map (Empedocles finding, not anticipated by the
# design memo or the Xenophanes div_concat precedent): "77,78" and
# "148,149,150" are each ONE export div (not several, unlike Xenophanes'
# A28) whose printed DK heading spans two/three consecutive numbers —
# content-verified (see stage1_greek.py's compound_n_map module comment):
# the div's single continuous apparatus quotes/discusses content DK grouped
# under a joint heading, with no clean mechanical split point between the
# numbers (modern concordances, e.g. Wright's edition, likewise treat each
# as one grouped citation, "77-78" / "148-150"). Distinct from BOTH div_map
# (an EXTRA div merged as context around a real, independently-existing
# target) and div_concat (MULTIPLE source divs, no div of their own,
# composing ONE target): here there is exactly ONE div, filed under its
# FIRST number's column; the other number(s) are declared `expected_gaps`
# (B78, B149, B150 — no column of their own). CANON-log-worthy; flagged for
# a citation-grammar follow-up if John wants "B78"/"B149"/"B150"
# separately addressable (would need a hyphen-joined column grammar
# extension, out of scope here — see the Wave 1b Empedocles report).
#
# LARGEST FRAGMENTS (per the groundwork's hint): B17 is the largest verse
# span at 35 real citable lines (frr. 10-44 of the div's 44 raw <l>s — the
# "twofold tale" Love/Strife proem); B100 (the klepsydra/breathing simile)
# is second at 25 lines; B115 (the daimon/exile fragment) is third at 14
# lines within a much longer 60-line div (extensive Hippolytus/Plutarch/
# Plotinus doxographical apparatus surrounds it). All three, plus B84 (the
# lantern/eye simile, 11 lines) and B112 (the Katharmoi proem, "O friends,
# who dwell in the great city...", 12 lines), were individually verified
# against their well-attested printed text (see the report's hand-review
# list) — not left to the mechanical heuristic below.
citation:
  expand_citations: true  # DK source-citation expansion, rule E (John, 2026-09-24)
  scheme: dk
  series: B
  # dk_witness.py's owner-verified apparatus split (stage7_emit wiring):
  # count of this work's columns whose apparatus actually splits into
  # 2+ witnesses, cross-checked bidirectionally at preflight against the
  # emitted dist's own `witnesses` keys -- catches an unreviewed new
  # split and a stale declaration alike.
  dk_witness_split_columns: 31
  # Quote-mark polarity fix (owner ruling 2026-08-05, "we fix it and
  # make damn sure every instance is correct"): the raw TLG export
  # frequently opens a Greek quotation with U+2019 instead of U+2018 --
  # stage1_greek._dk_normalize_quote_marks fixes every BALANCED
  # (even-count) column automatically; this is that fix's own declared
  # count, cross-checked bidirectionally at preflight against the
  # emitted dist's actual U+2018/U+2019 total.
  dk_quote_marks_rewritten: 322
  # FAIL-CLOSED: this work's raw export carries an ODD
  # U+2018/U+2019 count in these column(s) -- cannot be paired,
  # left completely untouched by the fix above (see
  # stage1_greek._dk_normalize_quote_marks' module doc).
  dk_unbalanced_quote_columns:
    - B118
    - B142
    - B17
  lines: true
  # `verse_text_lines` (Empedocles finding, confirming and extending the
  # Parmenides/Xenophanes precedent at much greater scale): <hi
  # rend="letter-spacing"> almost NEVER brackets a fragment's real verse in
  # this corpus — it marks only short, elliptical apparatus PREVIEWS
  # (single-quoted, elided with "...", e.g. "'ὡς ... ἦεν'"), immediately
  # followed (sometimes after further prose discussion, occasionally MANY
  # lines later, see B84/B115) by the full, unmarked verse. Every column
  # below is a declaration of which raw <l n> values are the fragment's
  # own real, DK-citable verse. HISTORY: the original wave built these in
  # two passes (a programmatic last-apparatus-marker heuristic plus hand
  # review of ~57 long/famous columns); a Grok-4.5 content audit
  # (2026-07-17) then found the heuristic had failed on 46 of the short
  # columns — host prose (Plutarch/Aristotle/Simplicius continuing in
  # unmarked Greek after a brief Latin lemma) declared as Empedoclean
  # verse, plus two role-inverted columns (B138, B148). The consolidated
  # fix round re-derived EVERY column by direct content reading of its div
  # (no heuristics): all 46 Grok corrections applied and XML-verified, and
  # the remaining un-audited pool read line-by-line, which caught 8 more
  # (B23, B60, B89, B122, B123, B129, B131, B154 — same defect shape).
  # Every declaration below is now individually content-verified.
  #
  # Whole-line-granularity limitation (accepted, documented): a declared
  # line is text-or-context as a WHOLE. Where the only Empedoclean words
  # sit embedded inside a host's own sentence mid-line, the column is
  # declared [] + unmarked_columns (B58/B97/B152/B153a/B158/B159 — see
  # the unmarked_columns comment); where verse and framing share a line
  # but the line is predominantly verse, the line is kept as text with
  # the host residue accepted (B95's embedded φησίν; B109a's lines 5-6,
  # where the letter-spaced ἀπορροὰς ... εἰκόνας interleaves with
  # Proclus' φαίη ἂν framing on both lines — no cleaner whole-line split
  # exists). B154's lines 12-13 (predominantly Plutarch paraphrase with
  # short embedded quote fragments) went the other way: excluded, at the
  # cost of the quote fragments οὔπω δ' ἥλιος / ἔχων δρόμον, ἠῶ.
  #
  # TWO corrections found only at build time (preflight's token-walk gate
  # caught both — genuinely new evidence the initial hand-review missed):
  #   - B109a: the initial declaration [2,3,4,5,6] wrongly swept in PROCLUS'
  #     OWN extended prose commentary on reflection/optics (lines 2-3, no
  #     Empedoclean content at all) ahead of the real letter-spaced
  #     Empedoclean words ("ἀπορροὰς ... ὄμμασιν ὥσπερ ἐούσας εἰκόνας" —
  #     effluences fitting into the eyes like images, his theory of vision)
  #     at lines 5-6 — the same "extended commentary before the real quote"
  #     shape as B84/B115, just missed on the first pass since its Latin
  #     citation marker sits early (line 1), giving a falsely LOW apparent
  #     risk score. Corrected to [5, 6].
  #   - B142 (a damaged Herculaneum papyrus, PHerc. 1012): the apparatus
  #     prints the SAME verse TWICE — once as the raw, letter-spaced but
  #     illegible papyrus transcription (lines 5-6: underdotted/uncertain
  #     letters, mid-word line-wrap hyphens, editorial "(5)" insertions —
  #     none of it real running Greek prose), once as the editors'
  #     RECONSTRUCTED clean reading (lines 7-8, matching Burnet's own
  #     translation "(142)"). Only the reconstruction is DK's real citable
  #     text; the raw transcription is presentational apparatus, not a
  #     second attestation. Corrected to [7, 8] (from an initial [5,6,7,8]
  #     that also tried to tokenize the illegible papyrus line).
