# Burnet EGP 3rd ed. (1920, Wikisource) English, retained as the secondary
# translation -- extracted
# by pipeline/tools/extract_burnet_wikisource.py's `build_empedocles`
# (Ch. V, "Empedokles of Akragas," his own full chapter, djvu pp. 211-264 /
# printed pp. 197-250 — like Heraclitus/Parmenides, unlike Xenophanes'
# shared half-chapter). Burnet's Empedocles translation is CONTINUOUS PROSE
# with sparse every-5th-Diels-line marginal sidenote markers, matching the
# Parmenides precedent exactly (not hard-lineated verse) — wired the same
# way, via the `paras` standoff channel.
english:
  primary:
    id: freeman
    name: "Kathleen Freeman, Ancilla to the Pre-Socratic Philosophers (Blackwell, 1948)"
    model: freeman
    file: "freeman-ancilla/freeman-empedocles.clean.json"
    license:
      status: public-domain-us
      rationale: "Kathleen Freeman's Ancilla to the Pre-Socratic Philosophers (1948) is treated as US public domain per John's 2026-07-23 ruling (CANON.md, Freeman Ancilla copyright ruling); covered by attribution.astro's site-wide translation public-domain notice."
    group_headers_file: "freeman-ancilla/freeman-empedocles.group_headers.json"
  # John's ruling 2026-07-29: B109a/B152 are Freeman's own wholly
  # parenthetical précis of a reporting source, with no translated
  # context-english span covering the same material -- labeled a summary
  # rather than suppressed (stage1_freeman_english.py gate 5; see
  # EnglishChunk.summary).
  summary_labels: [B109a, B152]
  secondary:
    id: burnet
    name: "John Burnet, Early Greek Philosophy, 3rd ed. (A. & C. Black, 1920)"
    model: archive
    file: "burnet-egp/burnet-empedocles.clean.json"
    license:
      status: public-domain-us
      rationale: "Asserted US public domain by attribution.astro's site-wide translation notice: every translation listed there is United States public domain."
    paras_sidecar: "burnet-egp/burnet-empedocles-paras.json"

# 14 of 161 spine columns Burnet's translation does not cover (91% coverage
# -- verified against burnet-empedocles.clean.json's own 147-key set, which
# has ZERO keys without a matching spine column, confirming the extractor's
# heading remap/collapse/drop are all correct): B5 (Plutarch's short
# fish/silence fragment, content-verified genuinely un-translated -- his
# listing jumps (4)/(5)->(6) with no heading for it at all, see
# pipeline/tools/extract_burnet_wikisource.py's module comment); B109a (a
# lettered variant his pre-DK6 numbering has no heading for); B151-B159
# (his own listing's last heading is (148) -- genuine edition-coverage
# gaps, matching the Parmenides/Xenophanes "his edition simply never
# reached" precedent, not extraction defects).
alignment_allow_unmatched_secondary:
  - "1:B5"
  - "1:B109a"
  - "1:B151"
  - "1:B152"
  - "1:B153"
  - "1:B153a"
  - "1:B154"
  - "1:B154a"
  - "1:B154c"
  - "1:B155"
  - "1:B156"
  - "1:B157"
  - "1:B158"
  - "1:B159"

