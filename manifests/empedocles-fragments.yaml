  # B7: Hesychius' lexicon entry DOES letter-space one word ("ἀγένητα:" —
  # the headword itself, DK's citable one-word fragment), but the rest of
  # the line ("στοιχεῖα. παρ' Ἐμπεδοκλεῖ HESYCH.") is Hesychius' OWN gloss
  # text — the Xenophanes B39/B40/B41 lexicographic-headword pattern
  # exactly (a `verse_text_lines` override applies at WHOLE-LINE
  # granularity, so leaving it undeclared would attribute Hesychius' own
  # gloss to Empedocles). Declared `verse_text_lines: []` above to suppress
  # the mechanical whole-line promotion, per that precedent — a positive
  # declaration, not merely an absence of one. B92 (Aristotle's own
  # extended prose paraphrase about semen-mixture) carries NO
  # letter-spacing anywhere at all — its own `[]` entry above suppresses
  # nothing that needed suppressing, declared anyway for explicitness and
  # symmetry with B7 (Xenophanes B13 precedent). Both therefore carry no
  # role='text' block after processing (memo gate 4).
  #
  # Six more []-columns joined B7/B92 in the 2026-07-17 content-audit fix
  # round (Grok verification + full direct re-read of every div): each is
  # a fragment whose Empedoclean content survives ONLY as a short phrase
  # embedded inside the host's own sentence, so NO raw <l> is citable at
  # whole-line granularity — B58 (Simplicius' paraphrase around
  # letter-spaced μουνομελῆ/γυῖα/ἐπλανᾶτο), B97 (Aristotle PA prose around
  # ῥάχιν), B152 (Aristotle Poet.'s metaphor discussion around γῆρας
  # ἡμέρας/δυσμὰς βίου), B153a (Theo Smyrn.'s ἐν ἑπτὰ ἑβδομάσιν report),
  # B158 (Hierocles' paraphrase around αἰῶνος ἀμερθείς), B159 (Aristotle
  # GC prose around σωρευόμενον μέγεθος).
  unmarked_columns:
    - B7
    - B58
    - B92
    - B97
    - B152
    - B153a
    - B158
    - B159
  # "77,78" -> B77 (content: Theophrastus/Plutarch's joint witness to the
  # evergreen-tree couplet "δένδρεα δ' ἐμπεδόφυλλα..."); "148,149,150" ->
  # B148 (content: Plutarch's joint witness to three one-word epithets,
  # "ἀμφιβρότην χθόνα" / "νεφεληγερέτην" / "πολυαίματον" — see the module
  # comment above and stage1_greek.py's compound_n_map doc).
  compound_n_map:
    "77,78": "77"
    "148,149,150": "148"
  # Sol blocker S3: two manifest-declared, work-scoped export repairs,
  # replacing what used to be unconditional module-level fixes in
  # stage1_greek.py applied to every DK verse work's every column on the
  # strength of exactly one Empedocles div's evidence.
  #
  # export_artifact_chars: U+1017C GREEK OBOL SIGN, verified glued directly
  # onto "ὁρῶντα" with no separating space in B109a (div n="109a" line 3,
  # "ἐπὶ τὸν ὁρῶντα𐅼.") -- a confirmed Diogenes/TLG export artifact, not
  # part of the word and not something stage3_tokenize.py's Beta Code
  # transliteration handles.
  export_artifact_chars:
    - "𐅼"
  # dk_damaged_columns: the only column whose apparatus prints a damaged
  # papyrus transcription (B142, PHerc. 1012) needing the inline-wrap-
  # rejoin and damage-period cleanups (see stage1_greek.py's
  # _DK_INLINE_WRAP_RE/_DK_DAMAGE_PERIOD_RE docs) -- scoped here so those
  # two regexes never fire on any other column or work.
  dk_damaged_columns:
    - B142
  # B94: Plutarch's Quaestiones Naturales survives for this passage only in
  # a LATIN paraphrase (no Greek text at all) that itself renders a lost
  # Empedoclean couplet in Latin hexameter — the Parmenides B18 precedent
  # exactly (a Latin retranslation of lost Greek verse). Zero Greek tokens
  # by construction, not an extraction failure (design memo §4.4).
  latin_fragments:
    - B94
  # B78, B149, B150: absorbed into B77/B148 respectively via
  # compound_n_map above — DK's own joint heading means no column of their
  # own ever exists (see the module comment). B154b: a genuine gap in the
  # lettered 154-run (154, 154a, 154c all exist as ordinary divs; 154b does
  # not) — declared so a re-export that restores/removes a div is caught.
  expected_gaps:
    - B78
    - B149
    - B150
    - B154b

