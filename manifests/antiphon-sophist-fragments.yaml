# Antiphon the Sophist Fragments (DK 87 B) — pipeline manifest (dk scheme:
# one flat div[@type="Fragment"][@n] per citable fragment, plain <p> prose,
# no <l> lines throughout -- including B44, see below). Freeman Ancilla
# phase 3 (docs/phase3-sourcing-queue.md): Freeman is the sole English
# translation; her fifth-edition chapter ends at B118 and does not reach
# B82-B117 (DK6's later insertions), a genuine primary-edition gap.
#
# Confirmed directly against the export's own <sourceDesc>: 'Antiphon
# Soph., Fragmenta (1147: 003) "Die Fragmente der Vorsokratiker, vol. 2,
# 6th edn.", ...'.
#
# TITLE DIVS (4, stripped by `_DK_TITLE_N_RE`, never columns): "tit,1-44"
# ("Antiphon's On Truth, books A/B", covering B1-B44), "tit,44a-71" ("On
# Concord"), "tit,72-77" ("Politicus"), "tit,78-81a" ("On the
# Interpretation of Dreams") -- Greek capital-letter section headers in
# the export, given here in translation only. Each content-verified a pure
# section-title header (a bare title only, no fragment text of its own).
#
# ★ B44 STRUCTURE FINDING (task-flagged risk, content-verified directly):
# B44 (On Truth, POxy 1364 + related papyri) is NOT one export div but
# ELEVEN, split at the papyrus's own column boundaries: n="44,A,col1"
# through "44,A,col7" (POxy 1364), "44,B,col1"/"44,B,col2", "44,C,col1"/
# "44,C,col2" -- no separate plain "44" div at all. The SAME structural
# shape as Xenophanes A28 (5 divs, no plain div, split at a quoted
# treatise's own page boundaries) -- composed via `citation.div_concat`
# below into ONE continuous B44 column, document order (matches the
# export's own div order exactly, verified). The papyrus is genuinely
# damaged: literal ASCII dot-runs mark illegible stretches ("........."),
# and angle brackets `<>` mark Diels' editorially-supplied letters (the
# SAME well-attested DK convention already handled corpus-wide by
# stage3_tokenize.py's `_SIGLA`/`_PUNCT` edge-stripping -- the Schenkl
# angle-bracket-supplement precedent, see that module's own docstring's
# worked example). Checked directly, token by
# token, against every word in all 11 columns: NOT ONE dot-run is glued
# DIRECTLY to a Greek letter with no intervening siglum or whitespace (the
# only shape `_DK_DAMAGE_PERIOD_LOWER_RE`/`dk_damaged_columns` fixes) --
# every dot-run sits at a token's own edge (stripped by ordinary `_PUNCT`
# edge-trimming) or is immediately followed by a `<>`/`[]` siglum
# (stripped by `_SIGLA`, never from the surface `t`, always from the
# lookup key `k`) before any Greek letter. Combining dot-below (U+0323,
# marking an editorially DOUBTFUL letter) is already handled by
# beta.py's existing NFD-strip. Conclusion: B44's damage markup is fully
# covered by existing, already-proven mechanisms -- `dk_damaged_columns` is
# NOT declared for this work (no evidence it is needed, unlike Democritus
# A99a/Empedocles B142).
#
# LETTER-SPACING FINDING (B44 only): a single self-closing
# `<hi rend="letter-spacing"/>` milestone in "44,A,col1" -- its tail is
# NOT empty (the milestone opens role='text' for the rest of that column's
# remaining content, ambient-threaded across all 11 source divs exactly
# like the ordinary verse-mechanical milestone contract), so the entire
# rest of the papyrus text after that point is a single (very large)
# role='text' block -- NOT an `unmarked_columns` case (confirmed directly
# by running stage1: declaring B44 unmarked fails loudly, "no such column
# was emitted [as unmarked]" is wrong -- it DOES emit a text block).
#
# STRUCTURE (excluding B44's 11 source divs and the 4 title divs): 125
# ordinary citable columns, B1-B43 (43, B44 composed separately), B44a,
# B45-B71 (27), B71a is absent -- correction, see exact list: B1-118
# consecutively present (with lettered B24a, B44a, B53a, B67a, B81a, B93a,
# B93b, B106a) EXCEPT B44 itself (composed via div_concat, not a plain
# div). No numeric gaps at all beyond B44's own absence. Total spine:
# 125 ordinary + 1 (B44, div_concat) = 126 columns.
#
# LETTER-SPACING FINDING (ordinary columns): 115 of 125 carry at least one
# <hi rend="letter-spacing"> span. 10 are fully unmarked — declared below,
# content-verified per column: B13 (Aristotle on circle-squaring, pure
# doxography), B26-B28 (Aëtius doxography on Antiphon's astronomy, three
# consecutive columns), B62 (a bare one-line doxographic note), B79-B81
# (Cicero/Seneca discussing Antiphon's dream-book -- entirely LATIN
# narrative with no quoted Greek and no letter-spacing marking at all;
# NOT a `latin_fragments` case, which is scoped to a MARKED Latin span --
# these three are simply unmarked, their underlying language irrelevant to
# that declaration), B81a (Melampus doxography), B118 (a one-line
# doxographic note).
#
# LATIN: no MARKED (letter-spacing) span in this work is Latin-only --
# checked directly against every one of the 115 marked columns' span text.
# B79-B81's Latin content is entirely unmarked (see above), so
# `citation.latin_fragments` is not declared for this work.
work:
  id: antiphon-sophist-fragments
  title: "Fragments"
  author: "antiphon-sophist"
  language: "grc"
  tlg_author: "1147"
  tlg_work: "003"
  greek_edition: "Diels, H. and Kranz, W. (eds.), Die Fragmente der Vorsokratiker, 6th ed., vol. 2 (Berlin: Weidmann, 1952), 87 B"
  # FATAL sourceDesc gate: stage1's _check_sourcedesc asserts this exact
  # substring is present in the export XML's own <teiHeader><sourceDesc>
  # text -- verified verbatim against build/export/.../tlg1147003.xml.
  expected_sourcedesc: 'Antiphon Soph., Fragmenta (1147: 003) "Die Fragmente der Vorsokratiker, vol. 2'

citation:
  expand_citations: true  # DK source-citation expansion, rule E (John, 2026-09-24)
  scheme: dk
  series: B
  # dk_witness.py's owner-verified apparatus split (stage7_emit wiring):
  # count of this work's columns whose apparatus actually splits into
  # 2+ witnesses, cross-checked bidirectionally at preflight against the
  # emitted dist's own `witnesses` keys -- catches an unreviewed new
  # split and a stale declaration alike.
  dk_witness_split_columns: 7
  # Quote-mark polarity fix (owner ruling 2026-08-05, "we fix it and
  # make damn sure every instance is correct"): the raw TLG export
  # frequently opens a Greek quotation with U+2019 instead of U+2018 --
  # stage1_greek._dk_normalize_quote_marks fixes every BALANCED
  # (even-count) column automatically; this is that fix's own declared
  # count, cross-checked bidirectionally at preflight against the
  # emitted dist's actual U+2018/U+2019 total.
  dk_quote_marks_rewritten: 52
  # FAIL-CLOSED: this work's raw export carries an ODD
  # U+2018/U+2019 count in these column(s) -- cannot be paired,
  # left completely untouched by the fix above (see
  # stage1_greek._dk_normalize_quote_marks' module doc).
  dk_unbalanced_quote_columns:
    - B1
    - B48
  hideLineNumbers: true
  div_concat:
