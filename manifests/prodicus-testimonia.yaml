# Prodicus of Ceos Testimonia (DK 84 A) — pipeline manifest (dk scheme: one
# flat div[@type="Fragment"][@n] per citable testimonium, plain <p> prose,
# no <l> lines). Greek-only work: ancient reports/paraphrases about
# Prodicus, not his own words; no free English translation exists (Burnet
# never covers the Sophists).
#
# Confirmed directly against the export's own <sourceDesc>: 'Prodicus Soph.,
# Testimonia (1634: 001) "Die Fragmente der Vorsokratiker, vol. 2, 6th
# edn.", ...'.
#
# TLG1634 carries only these two works (both used this wave — no non-DK
# exclusions needed for this author, unlike Protagoras/Gorgias).
#
# VERSE CHECK: exported plain (no `-y`); confirmed 0 <l> elements anywhere in
# the export. Pure prose (SUID., PHILOSTR., PLATO dialogues, XENOPH.,
# ARISTOPH., ARISTOT., DIONYS. Halic., GELL., QUINTIL.).
#
# STRUCTURE: 24 divs, n="1".."20" (20, consecutive, no gaps) plus four
# lettered variants (1a, 3a, 4a, 4b), each an independently-existing div. No
# title divs, no div_map/div_concat/compound_n_map cases.
#
# LETTER-SPACING FINDING: 8 of 24 columns carry at least one
# <hi rend="letter-spacing"> span (A11, A13-A19 — mostly Plato reporting
# Prodicus' trademark hair-splitting distinctions between near-synonyms,
# e.g. wish vs. desire, joy vs. pleasure). 16 columns are pure
# doxography/biography with no letter-spacing at all — declared
# `unmarked_columns` below, content-verified per column: A1, A1a, A2, A3,
# A3a, A4, A4a, A4b, A5, A6, A7, A8, A9, A10, A12, A20.
#
# LATIN: none marked — no `latin_fragments` case in this work (unlike
# prodicus-fragments.yaml's B3).

work:
  id: prodicus-testimonia
  title: "Testimonia"
  author: "prodicus"
  language: "grc"
  tlg_author: "1634"
  tlg_work: "001"
  greek_edition: "Diels, H. and Kranz, W. (eds.), Die Fragmente der Vorsokratiker, 6th ed., vol. 2 (Berlin: Weidmann, 1952), 84 A"
  # FATAL sourceDesc gate: stage1's _check_sourcedesc asserts this exact
  # substring is present in the export XML's own <teiHeader><sourceDesc>
  # text -- verified verbatim against build/export/.../tlg1634001.xml.
  expected_sourcedesc: 'Prodicus Soph., Testimonia (1634: 001) "Die Fragmente der Vorsokratiker, vol. 2'

citation:
  scheme: dk
  series: A
  # dk_witness.py's owner-verified apparatus split (stage7_emit wiring):
  # count of this work's columns whose apparatus actually splits into
  # 2+ witnesses, cross-checked bidirectionally at preflight against the
  # emitted dist's own `witnesses` keys -- catches an unreviewed new
  # split and a stale declaration alike.
  dk_witness_split_columns: 2
  # Quote-mark polarity fix (owner ruling 2026-08-05, "we fix it and
  # make damn sure every instance is correct"): the raw TLG export
  # frequently opens a Greek quotation with U+2019 instead of U+2018 --
  # stage1_greek._dk_normalize_quote_marks fixes every BALANCED
  # (even-count) column automatically; this is that fix's own declared
  # count, cross-checked bidirectionally at preflight against the
  # emitted dist's actual U+2018/U+2019 total.
  dk_quote_marks_rewritten: 6
  hideLineNumbers: true
  unmarked_columns:
    - A1
    - A1a
    - A2
    - A3
    - A3a
    - A4
    - A4a
    - A4b
    - A5
    - A6
    - A7
    - A8
    - A9
    - A10
    - A12
    - A20

# Digest fingerprint of the observed dk column spine (24 columns, A1-A20
# plus A1a/A3a/A4a/A4b, no gaps) — stage2 recomputes and compares it.
section_spine: { count: 24, sha256: "ddbbde990aaf2cbcfe325e1b10d19c693b71777f211b3331650f485e5fc450f7" }

# dk is bookless (a single declared book covers the whole spine, like the
# flat `section` scheme's Enchiridion).
books:
  - { n: 1, start: "A1", end: "A20" }

sources:
  tlg_dir_env: "TLG_DIR"
  tlg_dir_default: "../TLG Files/TLG"
  diogenes_server: "/Applications/Diogenes.app/Contents/server"
  diogenes_data: "/Applications/Diogenes.app/Contents/dependencies/data"

registry:
  id: prodicus-testimonia
  slug: testimonia
  title: Testimonia
  abbr: Prodic. A
  author: prodicus
  language: grc
  workType: fragments
  books: 1
  bookLabels:
    - '1'
  greekEdition: 'Diels, H. and Kranz, W. (eds.), Die Fragmente der Vorsokratiker, 6th ed., vol. 2 (Berlin: Weidmann, 1952), 84 A'
  greekSource:
    short: Diels–Kranz (1952)
    full: 'Diels, H. and Kranz, W. (eds.), Die Fragmente der Vorsokratiker, 6th ed., vol. 2 (Berlin: Weidmann, 1952), 84 A'
  translations: []
  citation:
    scheme: dk
    copyAbbr: DK 84
    dkChapter: 84
    series: A
  related:
    - id: prodicus-fragments
      label: 'The B-fragments: the surviving words themselves'
  blurb: Ancient reports, anecdote, and biography concerning Prodicus of Ceos — his embassies and lucrative lecture fees, his associates Theramenes and Euripides, and Socrates’ own (half-mocking) deference to his expertise in the correctness of names — the original Greek text.
