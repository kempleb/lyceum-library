  # A56: Cicero's paraphrase of Democritus' void/atom doctrine (de fin. I 6,
  # 17) carries letter-spacing on a Latin span, not Greek -- DK prints this
  # testimonium via a Latin source with no Greek witness at all. Zero Greek
  # tokens in its role='text' content by construction (design memo §4.4),
  # not an extraction failure.
  latin_fragments:
    - A56
  # A99a: a damaged Hibeh papyrus (Grenfell-Hunt col. 2) whose context
  # apparatus prints lacuna periods glued directly to LOWERCASE Greek
  # letters ("απο.λ.λιπομενης", "απ.δ..πεσθαι") with no separating space --
  # the same damage-transcription convention as Empedocles B142, but in
  # PROSE context and lowercase (B142 is verse and uppercase). NEW: this
  # wave extends `citation.dk_damaged_columns` and stage1_greek's damage-
  # period cleanup to the prose path via a separate lowercase-scoped regex
  # (`_DK_DAMAGE_PERIOD_LOWER_RE`), opt-in per column, never touching the
  # existing verse/uppercase B142 behavior. CANON-log-worthy / flagged for
  # review: a parser change, not a pure data declaration, though narrowly
  # scoped and precedented on the existing dk_damaged_columns mechanism.
  dk_damaged_columns:
    - A99a
  # A54: a genuine numbering gap in DK6 vol. 2's own A-series -- no div
  # n="54" in the export, no lettered "54a" either (unlike A10/A17/A35/A46/
  # A48/A60/A89/A93/A104/A126/A150/A155, which DO have real content, just
  # under a plain OR lettered n). Declared so a re-export that restores a
  # div DK previously omitted is caught, not silently accepted (mirrors the
  # Xenophanes A10 / Heraclitus B84 precedent).
  expected_gaps:
    - A54

# Digest fingerprint of the observed dk column spine (184 columns: A1-A170
# minus the A54 gap, plus the 14 lettered testimonia A10a/A17a/A35a/A46a/
# A48a/A48b/A60a/A89a/A93a/A104a/A126a/A150a/A155a/A155b) -- stage2
# recomputes and compares it.
section_spine: { count: 184, sha256: "253645922693a2662f9f7c7ee8eefaa061db3cb1b36f0f03523570a295094d02" }

# dk is bookless (a single declared book covers the whole spine, like the
# flat `section` scheme's Enchiridion).
books:
  - { n: 1, start: "A1", end: "A170" }

