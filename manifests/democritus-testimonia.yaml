# Democritus Testimonia (DK 68 A) — pipeline manifest (dk scheme: one flat
# div[@type="Fragment"][@n] per citable testimonium, no nested section div).
# Greek-only: same Burnet Ch. IX untagged-chapter posture as the Leucippus
# manifests (see leucippus-testimonia.yaml's comment) -- both philosophers
# share the one chapter, deferred to #48. Clean spine: 184 divs, all fit
# the simple digit(+letter) grammar -- no title divs, no comma-compound
# divs, no div_map/div_concat needed anywhere in this work (that
# irregularity is confined to the Fragmenta -- see democritus-fragments.yaml).

work:
  id: democritus-testimonia
  title: "Testimonia"
  author: "democritus"
  language: "grc"
  tlg_author: "1304"
  tlg_work: "001"
  greek_edition: "Diels, H. and Kranz, W. (eds.), Die Fragmente der Vorsokratiker, 6th ed., vol. 2 (Berlin: Weidmann, 1951–52), 68 A"
  # FATAL sourceDesc gate -- verified verbatim against
  # build/export/.../tlg1304001.xml (DK vol. 2, atomists).
  expected_sourcedesc: 'Democritus Phil., Testimonia (1304: 001) "Die Fragmente der Vorsokratiker, vol. 2'

citation:
  expand_citations: true  # DK source-citation expansion, rule E (John, 2026-09-24)
  scheme: dk
  series: A
  # dk_witness.py's owner-verified apparatus split (stage7_emit wiring):
  # count of this work's columns whose apparatus actually splits into
  # 2+ witnesses, cross-checked bidirectionally at preflight against the
  # emitted dist's own `witnesses` keys -- catches an unreviewed new
  # split and a stale declaration alike.
  dk_witness_split_columns: 33
  # Quote-mark polarity fix (owner ruling 2026-08-05, "we fix it and
  # make damn sure every instance is correct"): the raw TLG export
  # frequently opens a Greek quotation with U+2019 instead of U+2018 --
  # stage1_greek._dk_normalize_quote_marks fixes every BALANCED
  # (even-count) column automatically; this is that fix's own declared
  # count, cross-checked bidirectionally at preflight against the
  # emitted dist's actual U+2018/U+2019 total.
  dk_quote_marks_rewritten: 80
  hideLineNumbers: true
  # 149 of 184 testimonia carry no <hi rend="letter-spacing"> at all --
  # every div individually inspected via direct rend-attribute reading (no
  # heuristic guess: the prose dk parser derives role purely from the
  # literal `rend="letter-spacing"` markup, so this list was computed by
  # mechanically walking every div's markup, not by any statistical
  # classifier -- see the Wave-atomist implementation report). Matches the
  # Heraclitus/Milesian/Leucippus precedent at greater scale: ancient
  # doxography about a philosopher routinely carries nothing typographically
  # marked as his own words.
  unmarked_columns:
